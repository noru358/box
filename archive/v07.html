<title>택배 숨바꼭질</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
/* layout: 한 화면 게임. 위 상태줄(오른쪽 끝 일시정지), 가운데 3D 물류센터, 아래 모드별 도구줄, 메뉴·결과·기록은 덮는 판 */
:root{
  --floor:#e4dfd3; --ink:#1e1c18; --muted:#5f5a50; --card:#fffdf7; --line:#bfb8a8;
  --hazard:#f2c230; --alert:#d6322a; --me:#ff2bd6;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif; --f-big:'Black Han Sans','Apple SD Gothic Neo',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--floor);color:var(--ink);font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums;min-height:44px}
.bar b{font-weight:700}
.bar .sp{flex:1}
.meter{display:inline-block;vertical-align:middle;width:140px;height:10px;background:var(--line);position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--alert);width:0}
.sw{display:inline-block;width:18px;height:12px;vertical-align:middle;border:2px solid var(--ink)}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#d6d0c2;border:2px solid var(--ink);overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
.panel{position:absolute;inset:0;background:rgba(30,28,24,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.box{background:var(--card);max-width:680px;width:100%;padding:20px 22px;display:flex;flex-direction:column;gap:12px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--hazard);max-height:100%;overflow:auto;box-sizing:border-box}
.box h1{margin:0;font-family:var(--f-big);font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.05}
.box h2{margin:4px 0 0;font-size:15px}
.box p{margin:0;line-height:1.6;font-size:14px;color:var(--muted)}
.keys{font-size:13px;line-height:1.75}
kbd{font-family:var(--f-ui);font-size:12px;border:1px solid var(--ink);padding:0 5px;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:13px;font-weight:600}
select,textarea{font-family:var(--f-ui);font-size:13px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
select{min-height:40px;padding:0 6px}
textarea{width:100%;box-sizing:border-box;min-height:64px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
button{font-family:var(--f-ui);font-weight:700;font-size:14px;min-height:44px;padding:0 14px;border:3px solid var(--ink);background:var(--hazard);color:var(--ink);cursor:pointer}
button.alt{background:#fff}
button.on{background:var(--ink);color:#fff}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--alert);outline-offset:2px}
.msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-right:10px;border-right:2px solid var(--line)}
.tools .grp:last-child{border-right:0}
.tools button{min-height:40px;font-size:13px;padding:0 10px}
.cbtn{width:40px;padding:0!important}
.note{font-size:13px;color:var(--muted);line-height:1.6;max-width:80ch;margin:0}
table{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted)}
.tw{overflow-x:auto}
</style>

<div class="wrap">
  <div class="bar">
    <span id="modeL"><b>대기 중</b></span>
    <span id="timeWrap" hidden>남은 시간 <b id="timeL">-</b></span>
    <span id="goalL"></span>

  </div>
  <div class="stage" id="stage">

    <div class="panel" id="panel"><div class="box" id="panelBox"></div></div>
  </div>

    <div class="grp"><button class="alt" data-hop="3">↑ W</button><button class="alt" data-hop="1">↓ S</button><button class="alt" data-hop="2">← A</button><button class="alt" data-hop="0">→ D</button></div>
    <div class="grp"><button class="alt" id="fakeBtn">걸린 척 (C)</button><button class="alt" id="swapBtn">라벨 바꿔치기 (V)</button></div>
  </div>
  <div class="tools" id="seekTools" hidden>
    <button id="stopBtn">비상 정지</button><button class="alt" id="trailBtn">궤적</button>

    <div class="grp" id="palette"></div>

  </div>
  <p class="note">v7 · 색 칩 없앰: 노란 막대에서 "내 색 레일 쪽으로" 하나만 · X선 고리 삭제 · 기본 맵에 빠른·느린·역방향·정체 섞음 · 다섯 줄 맵에 재분류</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== ENGINE v7: 격자로 만들고 연속으로 흐른다, 노란 막대에서 내 색 레일 쪽으로 =====
const DIRS='>v<^',DX=[1,0,-1,0],DY=[0,1,0,-1];
const SPD={n:1,f:1.55,s:.6},BASE=1.25; // 칸/초
const CYCLE=4,ON=1.2,WARN=1;
const DIFF={easy:{name:'쉬움',tol:.42,aim:1.3,check:2.0,miss:1.0},normal:{name:'보통',tol:.28,aim:1.0,check:1.4,miss:1.6},hard:{name:'어려움',tol:.16,aim:.8,check:1.0,miss:2.2}};
function laneMap(rows,bars){const W=14,g=[Array(W).fill('..')];
  rows.forEach(r=>{const t=Array(W).fill(r.sp+r.d);const right=r.d==='>';t[right?0:W-1]='I'+r.d;t[right?W-1:0]='X'+r.d+r.c;bars.forEach(c=>t[c]='S'+r.d);Object.entries(r.ex||{}).forEach(([k,v])=>t[+k]=v);g.push(t);});
  g.push(Array(W).fill('..'));return g.map(r=>r.join(' ')).join('/');}
const MAPS={
  basic:{name:'기본(섞임)',str:laneMap([{d:'>',sp:'n',c:0},{d:'<',sp:'f',c:1},{d:'>',sp:'s',c:2,ex:{6:'J>'}},{d:'>',sp:'n',c:3}],[3,9])},
  five:{name:'다섯 줄',str:laneMap([{d:'>',sp:'n',c:0},{d:'>',sp:'f',c:1,ex:{5:'C>3'}},{d:'<',sp:'n',c:2},{d:'>',sp:'s',c:3,ex:{8:'J>'}},{d:'<',sp:'n',c:4,ex:{10:'C<0'}}],[2,7,11])},
  cross:{name:'회전판 교차로',str:(function(){const W=14,H=8,g=[];for(let y=0;y<H;y++)g.push(Array(W).fill('..'));
    for(const [r,col] of [[2,0],[5,1]]){g[r][0]='I>';for(let x=1;x<W-1;x++)g[r][x]='n>';g[r][W-1]='X>'+col;}
    for(const [c,col] of [[4,2],[9,3]]){g[0][c]='Iv';for(let y=1;y<H-1;y++)g[y][c]=g[y][c]==='..'?'nv':g[y][c];g[H-1][c]='Xv'+col;}
    g[2][4]='T>v2';g[2][9]='T>v3';g[5][4]='T>v3';g[5][9]='T>v2';return g.map(r=>r.join(' ')).join('/');})()}
};
function parseTile(tok){if(!tok||tok==='..')return null;const t=tok[0],d=DIRS.indexOf(tok[1]);if(d<0)return null;
  switch(t){case 'n':case 'f':case 's':return {t:'belt',sp:t,d};
    case 'S':return {t:'sort',d};
    case 'T':{const s=DIRS.indexOf(tok[2]);return s<0?null:{t:'turn',d,s,per:Math.max(1,+tok[3]||2)};}
    case 'J':return {t:'jam',d};case 'C':return {t:'relabel',d,c:Math.min(4,+tok[2]||0)};case 'X':return {t:'exit',d,c:Math.min(4,+tok[2]||0)};
    case 'I':return {t:'spawn',d};case 'G':return {t:'belt',sp:'n',d};}return null;}
function tileToken(t){if(!t)return '..';const D=DIRS[t.d];switch(t.t){case 'belt':return t.sp+D;case 'sort':return 'S'+D;case 'turn':return 'T'+D+DIRS[t.s]+t.per;
  case 'jam':return 'J'+D;case 'relabel':return 'C'+D+t.c;case 'exit':return 'X'+D+t.c;case 'spawn':return 'I'+D;}return '..';}
function parseMap(str){const rows=str.trim().split('/').map(r=>r.trim().split(/\s+/));const H=rows.length,W=Math.max(...rows.map(r=>r.length));
  return {W,H,tiles:rows.map(r=>Array.from({length:W},(_,x)=>parseTile(r[x])))};}
function mapToStr(m){return m.tiles.map(r=>r.map(tileToken).join(' ')).join('/');}

function createWorld(str,opt){opt=opt||{};const rng=opt.rng||Math.random;const {W,H,tiles}=parseMap(str);const diff=DIFF[opt.diff||'normal'];
  const cells=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(tiles[y][x])cells.push([x,y]);
  const colors=[...new Set(cells.map(([x,y])=>tiles[y][x]).filter(t=>t.t==='exit').map(t=>t.c))];if(!colors.length)colors.push(0);
  const spawns=cells.filter(([x,y])=>tiles[y][x].t==='spawn');
  const w={W,H,tiles,colors,diff,boxes:[],t:0,sortT:0,sortOn:true,sortWarn:false,halt:0,events:[]};
  const T=(x,y)=>(x>=0&&y>=0&&x<W&&y<H)?tiles[y][x]:null;w.T=T;
  const wrap=(x,y)=>[(x+W)%W,(y+H)%H];
  // 색마다 출고까지 거리
  const dist={};for(const c of colors){const D=tiles.map(r=>r.map(()=>1e9));const q=[];cells.forEach(([x,y])=>{const t=tiles[y][x];if(t.t==='exit'&&t.c===c){D[y][x]=0;q.push([x,y]);}});
    const preds={};cells.forEach(([x,y])=>{const t=tiles[y][x];const outs=t.t==='sort'?[t.d,(t.d+1)%4,(t.d+3)%4]:t.t==='turn'?[t.d,t.s]:[t.d];outs.forEach(d=>{let [nx,ny]=wrap(x+DX[d],y+DY[d]);if(T(nx,ny))(preds[nx+','+ny]=preds[nx+','+ny]||[]).push([x,y]);});
      for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(T(nx,ny)&&d%2!==t.d%2)(preds[nx+','+ny]=preds[nx+','+ny]||[]).push([x,y,1]);}});
    while(q.length){const [x,y]=q.shift();(preds[x+','+y]||[]).forEach(([px,py,side])=>{const v=D[y][x]+(side?3:1);if(D[py][px]>v){D[py][px]=v;q.push([px,py]);}});}
    dist[c]=D;}
  w.dist=(c,x,y)=>dist[c]?dist[c][y][x]:1e9;
  // 레일 색: 이 칸에서 곧장 가면 닿는 출고구 색
  const laneC=tiles.map((r,y)=>r.map((t,x)=>{if(!t)return -1;let cx=x,cy=y,d=t.d;for(let i=0;i<W*H;i++){const tt=tiles[cy][cx];if(!tt||tt.t==='turn')return -1;if(tt.t==='exit')return tt.c;d=tt.d;[cx,cy]=wrap(cx+DX[d],cy+DY[d]);}return -1;}));
  w.laneC=(x,y)=>(T(x,y)?laneC[y][x]:-1);
  // 노란 막대에서 이 상자가 가야 할 옆 방향(-1 = 안 감)
  w.bestSide=(b,x,y)=>{const t=T(x,y);if(!t||t.t!=='sort'||laneC[y][x]===b.dest)return -1;let best=-1,bd=w.dist(b.dest,x,y);
    for(const h of [(t.d+1)%4,(t.d+3)%4]){const nx=x+DX[h],ny=y+DY[h];if(!T(nx,ny))continue;const v=w.dist(b.dest,nx,ny);if(v<bd){bd=v;best=h;}}return best;};
  w.turnDir=(t,x,y)=>Math.floor((w.t+(x+y)*.37)/t.per)%2?t.s:t.d;
  w.jamOpen=(x,y)=>((w.t+x*.7+y*.3)%5)<2.2;
  const human=b=>b.kind!=='npc';
  w.add=function(kind){const free=cells.filter(([x,y])=>!w.boxes.some(b=>!b.gone&&b.cx===x&&b.cy===y)&&tiles[y][x].t!=='exit');if(!free.length)return null;const [x,y]=free[(rng()*free.length)|0];
    const b={id:w.boxes.length,kind,dest:colors[(rng()*colors.length)|0],size:[1.25,1.5,1.75][(rng()*3)|0],cx:x,cy:y,d:tiles[y][x].d,s:rng()*.9,mul:1,follow:1,sus:0,deliv:0,gone:false,found:false,pending:false,slide:null,hold:0,stopLag:0,fakeT:0,checked:null,plan:null,hist:[]};
    if(tiles[y][x].t==='sort'||tiles[y][x].t==='turn')b.s=0;w.boxes.push(b);return b;};
  w.center=(x,y)=>[x,y];
  w.pos=b=>{let x=b.cx+DX[b.d]*b.s,y=b.cy+DY[b.d]*b.s;if(b.slide){const k=Math.min(1,b.slide.t);x=b.slide.fx+(x-b.slide.fx)*k;y=b.slide.fy+(y-b.slide.fy)*k;}return [x,y];};
  function respawn(b){const free=spawns.filter(([x,y])=>!w.boxes.some(o=>o!==b&&!o.gone&&!o.pending&&Math.hypot(o.cx+DX[o.d]*o.s-x,o.cy+DY[o.d]*o.s-y)<1));
    if(!free.length){b.pending=true;return;}const [x,y]=free[(rng()*free.length)|0];b.cx=x;b.cy=y;b.d=tiles[y][x].d;b.s=0;b.pending=false;b.slide=null;b.hist=[];}
  // 칸 중앙 도착: 다음 방향을 정한다
  function arrive(b){const t=tiles[b.cy][b.cx];b.checked=null;
    if(t.t==='relabel'){b.dest=t.c;}
    if(t.t==='exit'&&t.c===b.dest){b.deliv++;w.events.push({type:'deliver',b});
      if(b.kind==='npc')b.dest=colors[(rng()*colors.length)|0];else{const o=colors.filter(c=>c!==b.dest);if(o.length)b.dest=o[(rng()*o.length)|0];}
      b.plan=null;respawn(b);return;}
    if(t.t==='sort'){const h=w.sortOn?w.bestSide(b,b.cx,b.cy):-1;
      if(!human(b)){if(h>=0){b.d=h;w.events.push({type:'spark',x:b.cx,y:b.cy});return;}}
      else if(h>=0)b.checked={x:b.cx,y:b.cy};
      b.d=t.d;return;}
    if(t.t==='turn'){b.d=w.turnDir(t,b.cx,b.cy);return;}
    b.d=t.d;}
  // 사람 상자의 옆 칸 갈아타기
  w.hop=function(b,h){if(b.pending||b.gone||b.slide&&b.slide.t<1)return null;if(h%2===b.d%2)return null;
    const [px,py]=w.pos(b);const ox=b.cx,oy=b.cy;const nx=b.cx+DX[h],ny=b.cy+DY[h];const nt=T(nx,ny);if(!nt)return null;
    // 분류기 막대에서 얼마나 어긋났나(칸 단위, 막대 = 칸 중앙)
    const here=tiles[b.cy][b.cx],ahead=T(b.cx+DX[b.d],b.cy+DY[b.d]);let sorter=null,off=null,sx=0,sy=0;
    if(here.t==='sort'){sorter=here;off=b.s;sx=b.cx;sy=b.cy;}else if(ahead&&ahead.t==='sort'&&b.s>.5){sorter=ahead;off=-(1-b.s);sx=b.cx+DX[b.d];sy=b.cy+DY[b.d];}
    const legal=!!(sorter&&w.sortOn&&h===w.bestSide(b,sx,sy));
    const dir2=nt.t==='sort'||nt.t==='turn'?nt.d:nt.d;let cx=nx,cy=ny,s=b.s,d=dir2;
    if(dir2===b.d){}else if(dir2===(b.d+2)%4){const fx=nx+DX[b.d],fy=ny+DY[b.d];if(T(fx,fy)){cx=fx;cy=fy;s=1-b.s;}else s=0;}else s=0;
    b.cx=cx;b.cy=cy;b.s=s;b.d=d;b.slide={fx:px,fy:py,t:0};b.checked=null;
    const toward=w.dist(b.dest,nx,ny)<w.dist(b.dest,ox,oy);
    w.events.push({type:'hop',b,legal,off,toward});
    if(legal&&Math.abs(off)<.06)w.events.push({type:'spark',x:px,y:py});
    return {legal,off,toward};};
  w.step=function(dt){w.t+=dt;w.events=[];w.sortT=(w.sortT+dt)%CYCLE;w.sortOn=w.sortT<ON;w.sortWarn=w.sortT>CYCLE-WARN;
    if(w.halt>0)w.halt-=dt;
    // 차간 거리
    const P=w.boxes.map(b=>(b.gone||b.pending)?null:w.pos(b));
    w.boxes.forEach((b,i)=>{b.follow=1;if(!P[i])return;const hx=DX[b.d],hy=DY[b.d];
      for(let j=0;j<w.boxes.length;j++){if(j===i||!P[j])continue;if(w.boxes[j].d!==b.d||w.boxes[j].slide)continue;const rx=P[j][0]-P[i][0],ry=P[j][1]-P[i][1];const al=rx*hx+ry*hy;if(al<=0||al>.95)continue;const lat=Math.abs(rx*hy-ry*hx);if(lat>.42)continue;
        b.follow=Math.min(b.follow,Math.max(0,(al-.62)/.33));}});
    for(const b of w.boxes){if(b.gone)continue;if(b.slide){b.slide.t+=dt/.28;if(b.slide.t>=1)b.slide=null;}
      if(b.pending){respawn(b);continue;}b.sus=Math.max(0,b.sus-dt*.35);if(b.fakeT>0)b.fakeT-=dt;
      if(b.hold>0){b.hold-=dt;continue;}
      if(w.halt>0){if(b.stopLag>0)b.stopLag-=dt;else continue;}
      const t=tiles[b.cy][b.cx];if(t.t==='jam'&&b.s===0&&!w.jamOpen(b.cx,b.cy))continue;
      const sp=(t.t==='belt'?SPD[t.sp]:1)*BASE*b.mul*b.follow;let s=b.s+sp*dt;
      // 놓친 분류: 켜진 막대를 내 색인데 그냥 지나침
      if(b.checked&&s>w.diff.tol&&b.checked.x===b.cx&&b.checked.y===b.cy){w.events.push({type:'missed',b});b.checked=null;}
      if(t.t==='jam'&&b.s<1e-9&&s>0&&!w.jamOpen(b.cx,b.cy)){s=0;}
      while(s>=1){s-=1;let nx=b.cx+DX[b.d],ny=b.cy+DY[b.d];let wrapped=false;if(!T(nx,ny)){[nx,ny]=wrap(nx,ny);wrapped=true;}
        if(!T(nx,ny)){s=0;break;}b.cx=nx;b.cy=ny;if(wrapped){b.slide=null;b.hist=[];}const before=b.d;arrive(b);if(b.pending)break;
        if(tiles[b.cy][b.cx].t==='jam'&&!w.jamOpen(b.cx,b.cy)){s=0;break;}}
      if(!b.pending)b.s=s;}
  };
  return w;}
if(typeof module!=='undefined')module.exports={createWorld,MAPS,parseMap,mapToStr,parseTile,tileToken,DIFF,DIRS,DX,DY,CYCLE,ON};

</script>
<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$('c'),stage=$('stage');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));
const S=new THREE.Scene();S.background=new THREE.Color('#d6d0c2');
const cam=new THREE.PerspectiveCamera(36,16/9,.5,400);

}

  const best=k=>{const w=records.filter(r=>r.mode===k&&r.win);return w.length?w.reduce((a,b)=>b.score>a.score?b:a):null;};const bh=best('hide'),bs=best('seek');

const KD={KeyD:0,ArrowRight:0,KeyS:1,ArrowDown:1,KeyA:2,ArrowLeft:2,KeyW:3,ArrowUp:3};
function applyHop(b,r){if(!r)return;const tol=DIFF[diffKey].tol;if(!r.legal)sus(b,r.toward?2.2:3.4);else if(Math.abs(r.off)>tol)sus(b,1.2+(Math.abs(r.off)-tol)*5);if(world.halt>0)sus(b,2);}
function playerHop(h){if(mode!=='hide'||over||paused||!player||player.hold>0)return;applyHop(player,world.hop(player,h));}
function fake(){if(mode!=='hide'||over||paused||!fakes||player.hold>0||player.pending)return;fakes--;player.hold=1.5;player.fakeT=1.5;const m=meshes.get(player);if(m)m.bump=1.5;say('덜컹… (걸린 척)');updHud();}
function swapLabel(){if(mode!=='hide'||over||paused||!swaps||player.pending)return;const [px,py]=world.pos(player);
  const o=world.boxes.filter(b=>b!==player&&b.kind==='npc'&&!b.pending&&b.dest!==player.dest).map(b=>[b,Math.hypot(world.pos(b)[0]-px,world.pos(b)[1]-py)]).filter(x=>x[1]<.9).sort((a,c)=>a[1]-c[1])[0];
  if(!o){say('바로 옆에 바꿔칠 상자가 없어요');return;}swaps--;const t=player.dest;player.dest=o[0].dest;o[0].dest=t;say('라벨 바꿔치기!');updHud();}
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;keys[e.code]=true;if(e.repeat)return;
  if(e.code==='Escape'&&mode&&mode!=='edit'&&!over){paused?resume():pause();return;}
  if(mode==='edit'){if(e.code==='KeyR')rot();if(e.code==='KeyF')flipSide();return;}
  if(paused||over)return;
  if(mode==='hide'){if(e.code in KD){const h=KD[e.code];if(player&&h%2!==player.d%2){playerHop(h);}e.preventDefault();}if(e.code==='KeyC')fake();if(e.code==='KeyV')swapLabel();}
  if(mode==='seek'){if(e.code==='Space'){useStop();e.preventDefault();}if(e.code==='KeyT')useTrail();}});
addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-hop]').forEach(b=>b.onclick=()=>playerHop(+b.dataset.hop));
$('fakeBtn').onclick=fake;$('swapBtn').onclick=swapLabel;

// ---------- 찾는 쪽 ----------
function useStop(){if(mode!=='seek'||over||paused||!stops||world.halt>0)return;stops--;world.halt=2;bots.forEach(b=>{if(!b.found)b.stopLag=.2+Math.random()*.3;});say('비상 정지!');updHud();}
function clearTrails(){trailLines.forEach(l=>S.remove(l));trailLines=[];trailT=0;}
function useTrail(){if(mode!=='seek'||over||paused||!trails)return;trails--;clearTrails();trailT=3;
  world.boxes.forEach(b=>{if(b.hist.length<2||b.found||b.gone||b.pending)return;const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(b.hist.map(p=>new THREE.Vector3(p[0],.8,p[1]))),new THREE.LineBasicMaterial({color:'#1e1c18'}));S.add(l);trailLines.push(l);});updHud();}
$('stopBtn').onclick=useStop;$('trailBtn').onclick=useTrail;
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function setRay(e){const r=cv.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,cam);}
function pickBox(e){setRay(e);const objs=[];world.boxes.forEach(b=>{if(!b.found&&!b.gone&&!b.pending){const m=meshes.get(b);if(m)objs.push(m.body,m.lab);}});const h=ray.intersectObjects(objs)[0];return h&&h.object.userData.box;}
cv.addEventListener('click',e=>{if(mode!=='seek'||over||paused)return;const b=pickBox(e);if(!b)return;scans--;
  if(b.kind==='bot'){b.found=true;b.kind='npc';found++;meshes.get(b).body.material=M('#d6322a');say('사람이다! 삐빅');}else{time-=5;say('그냥 상자… −5초');}checkSeekEnd();updHud();});
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(mode!=='seek'||over||paused)return;const b=pickBox(e);if(!b)return;const m=meshes.get(b);
  if(m.pin){m.g.remove(m.pin);m.pin=null;}else{const p=new THREE.Group();const s=new THREE.Mesh(pinGeo,pinDark);s.position.y=.8;p.add(s);const h=new THREE.Mesh(pinHead,pinMat);h.position.y=1.7;p.add(h);p.position.y=b.size*.8+.33;m.g.add(p);m.pin=p;}});
function checkSeekEnd(){if(over)return;if(found+escaped>=3)end(found===3,`찾음 ${found}, 놓침 ${escaped}. 남은 시간 ${Math.ceil(time)}초, 스캔 ${scans}번 남김.`,found*1000+Math.max(0,time)*10+scans);
  else if(scans<=0)end(false,`스캔을 다 씀. 찾음 ${found}, 놓침 ${escaped}.`,found*1000);}

// 숨은 AI: 사람처럼 키를 누른다(반응 오차, 가끔 놓침, 급하면 지름)
const PERS={rush:{sig:.28,miss:.18,force:.35},careful:{sig:.18,miss:.1,force:.08},mimic:{sig:.1,miss:.06,force:.04}};
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
function botThink(b,dt){if(b.found||b.gone||b.pending||b.slide)return;const P=PERS[b.pers],k={easy:1.4,normal:1,hard:.7}[diffKey],panic=1-Math.max(0,time)/150;b.mul=1;
  const here=world.T(b.cx,b.cy),ax=b.cx+DX[b.d],ay=b.cy+DY[b.d],ahead=world.T(ax,ay);
  let st=null,sx=0,sy=0,signed=0;if(here&&here.t==='sort'&&b.s<.6){st=here;sx=b.cx;sy=b.cy;signed=b.s;}else if(ahead&&ahead.t==='sort'&&b.s>.25){st=ahead;sx=ax;sy=ay;signed=-(1-b.s);}
  if(!st){b.plan=null;if(b.pers==='rush'&&panic>.6&&Math.random()<dt*.15){for(const h of [(b.d+1)%4,(b.d+3)%4]){const nx=b.cx+DX[h],ny=b.cy+DY[h];if(world.T(nx,ny)&&world.dist(b.dest,nx,ny)<world.dist(b.dest,b.cx,b.cy)){world.hop(b,h);break;}}}return;}
  const key=sx+','+sy;
  if(!b.plan||b.plan.key!==key){const side=world.bestSide(b,sx,sy),match=side>=0;const eta=Math.max(0,-signed)/(1.25);const lit=((world.sortT+eta)%CYCLE)<ON;let act='none',off=0;
    if(match&&lit){if(Math.random()<P.miss*k)act='miss';else{act='hop';off=Math.max(-.45,Math.min(.45,gauss()*P.sig*k));}}
    else if(match&&!lit){if(Math.random()<P.force*k+panic*.3*k){act='force';off=(Math.random()-.5)*.9;}else if(b.pers==='careful'&&eta<1.2)b.mul=Math.random()<.5?.62:1.45;}
    b.plan={key,act,off,done:false};}
  if(b.plan.act==='none'&&b.pers==='careful'&&signed<0)b.mul=b.mul;
  if(!b.plan.done&&(b.plan.act==='hop'||b.plan.act==='force')&&signed>=b.plan.off){b.plan.done=true;const side=world.bestSide(b,sx,sy);if(side>=0)world.hop(b,side);}}

// AI 직원
function huntStep(dt){const p=player,D=DIFF[diffKey];worker.position.z=wz(H-1)+CS*.9;
  if(hunt.stun>0){hunt.stun-=dt;return;}const [ppx]=world.pos(p);
  if(!hunt.target){worker.position.x+=(THREE.MathUtils.clamp(wx(ppx)*.4,wx(0),wx(W-1))-worker.position.x)*dt*.6;
    hsT-=dt;if(hsT<=0&&hstops>0){hstops--;hsT=25+Math.random()*15;world.halt=2;say('직원: 비상 정지!');}
    hunt.t-=dt;if(hunt.t<=0&&hunt.scans>0){hunt.t=D.check*(.8+Math.random()*.4);const cand=world.boxes.filter(b=>!b.gone&&!b.pending);const top=cand.reduce((a,b)=>b.sus>a.sus?b:a,cand[0]);
      if(top&&top.sus>1.1&&Math.random()<Math.min(.95,(top.sus-.9)/1.8)){hunt.target=top;hunt.aim=D.aim;}}}
  else{const t=hunt.target;const [tx,ty]=world.pos(t);worker.position.x+=(THREE.MathUtils.clamp(wx(tx),wx(0),wx(W-1))-worker.position.x)*dt*1.5;hunt.aim-=dt;ring.visible=laser.visible=true;ring.position.set(wx(tx),.38,wz(ty));
    laser.geometry.setFromPoints([new THREE.Vector3(worker.position.x,2.4,worker.position.z),new THREE.Vector3(wx(tx),t.size*.8+.33,wz(ty))]);
    if(hunt.aim<=0||t.pending){ring.visible=laser.visible=false;hunt.target=null;if(t.pending)return;hunt.scans--;
      if(t===p&&p.fakeT>0){say('삐— 바코드 인식 실패');hunt.stun=2.5;return;}
      if(t===p){end(false,`출고 ${p.deliv}/3에서 스캐너에 찍힘.`,p.deliv*100);return;}
      say('직원: 아… 그냥 상자네');hunt.stun=3;t.sus=0;}}}

// ---------- 편집기 ----------
const PAL=[['erase','지우개'],['n','벨트'],['f','빠른 벨트'],['s','느린 벨트'],['S','분류기'],['T','회전판'],['J','정체'],['C','재분류'],['X','출고'],['I','입고']];
let ed={tool:'n',d:0,side:1,cols:[0],tiles:null,painting:false};
function openEditor(){mode='edit';over=true;hideMarks();$('panel').hidden=true;['hideTools','seekTools','pauseBtn','timeWrap','susWrap'].forEach(id=>$(id).hidden=true);$('editTools').hidden=false;
  const m=parseMap(curEntry().str);const T=[];for(let y=0;y<8;y++){T.push([]);for(let x=0;x<14;x++)T[y].push((m.tiles[y]||[])[x]||null);}ed.tiles=T;
  world=null;clearMeshes();buildTiles(ed.tiles);if(edGrid)S.remove(edGrid);S.add(edGrid=makeEdGrid());$('modeL').innerHTML='<b>맵 만들기</b> · 칸을 클릭·드래그해서 칠하기';$('goalL').textContent='';
  $('palette').innerHTML=PAL.map(([k,n])=>`<button class="alt" data-tool="${k}">${n}</button>`).join('');$('palette').querySelectorAll('button').forEach(b=>b.onclick=()=>{ed.tool=b.dataset.tool;paintUi();});
  $('colorPick').innerHTML=COL.map((c,i)=>`<button class="alt cbtn" data-col="${i}" aria-label="색 ${i+1}" style="background:${c}"></button>`).join('');
  $('colorPick').querySelectorAll('button').forEach(b=>b.onclick=()=>{ed.cols=[+b.dataset.col];paintUi();});paintUi();}
function rot(){ed.d=(ed.d+1)%4;paintUi();}function flipSide(){ed.side=ed.side===1?3:1;paintUi();}
$('rotBtn').onclick=rot;$('sideBtn').onclick=flipSide;
function paintUi(){$('palette').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tool===ed.tool));$('rotBtn').textContent=`방향 ${'→↓←↑'[ed.d]} (R)`;
  $('sideBtn').textContent=`옆: ${ed.side===1?'오른쪽':'왼쪽'} (F)`;$('colorPick').querySelectorAll('button').forEach(b=>b.style.outline=ed.cols.includes(+b.dataset.col)?'4px solid #1e1c18':'none');}
function makeTile(){const d=ed.d,s=(d+ed.side)%4,c=ed.cols[0];switch(ed.tool){case 'erase':return null;case 'n':case 'f':case 's':return {t:'belt',sp:ed.tool,d};
  case 'S':return {t:'sort',d};case 'T':return {t:'turn',d,s,per:3};case 'J':return {t:'jam',d};case 'C':return {t:'relabel',d,c};case 'X':return {t:'exit',d,c};case 'I':return {t:'spawn',d};}}
const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hp=new THREE.Vector3();
function cellAt(e){setRay(e);if(!ray.ray.intersectPlane(plane,hp))return null;const x=Math.round(hp.x/CS+(W-1)/2),y=Math.round(hp.z/CS+(H-1)/2);return (x>=0&&y>=0&&x<W&&y<H)?[x,y]:null;}
function paint(e){const c=cellAt(e);if(!c)return;const [x,y]=c;const nt=makeTile();if(tileToken(ed.tiles[y][x])===tileToken(nt))return;ed.tiles[y][x]=nt;buildTiles(ed.tiles);}
cv.addEventListener('pointerdown',e=>{if(mode!=='edit'||e.button!==0)return;ed.painting=true;cv.setPointerCapture(e.pointerId);paint(e);});
cv.addEventListener('pointermove',e=>{if(mode==='edit'&&ed.painting)paint(e);});
cv.addEventListener('pointerup',()=>ed.painting=false);
$('editDone').onclick=()=>{const str=mapToStr({tiles:ed.tiles});const f=ed.tiles.flat();const ok=f.some(t=>t&&t.t==='spawn')&&f.some(t=>t&&t.t==='exit');
  if(edGrid){S.remove(edGrid);edGrid=null;}$('editTools').hidden=true;$('panel').hidden=false;
  $('panelBox').innerHTML=`<h1>내 맵</h1>${ok?'':'<p style="color:#d6322a">입고(흰 화살표 칸)와 출고(색 아치)가 하나 이상 있어야 상자가 돌 수 있어요.</p>'}
  <p>아래 문자열이 이 맵이에요. 친구에게 주면 붙여넣고 불러오기만 하면 돼요.</p><label for="shareTxt">공유 문자열</label><textarea id="shareTxt">${str}</textarea>
  <div class="row"><button id="saveMap"${ok?'':' disabled'}>내 맵으로 저장</button><button class="alt" id="copyMap">복사</button><button class="alt" id="loadMap">붙여넣은 걸로 불러오기</button><button class="alt" id="backEd">계속 편집</button><button class="alt" id="edMenu">메뉴로</button></div>`;
  $('saveMap').onclick=()=>{custom=$('shareTxt').value.trim();try{localStorage.setItem('parcel6-custom',custom);}catch(e){}curKey='custom';menu();say('내 맵으로 저장했어요');};
  $('copyMap').onclick=()=>{const t=$('shareTxt');if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>say('복사했어요'),()=>t.select());else t.select();};
  $('loadMap').onclick=()=>{const v=$('shareTxt').value.trim();try{const m=parseMap(v);if(!m.tiles.flat().some(Boolean))throw 0;custom=v;try{localStorage.setItem('parcel6-custom',custom);}catch(e){}curKey='custom';openEditor();}catch(err){say('문자열을 읽지 못했어요');}};
  $('backEd').onclick=()=>openEditor();$('edMenu').onclick=()=>menu();};

// ---------- 루프 ----------
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(world&&mode!=='edit'&&!paused){const live=(mode==='hide'||mode==='seek')&&!over;
    if(live){time-=dt;
      if(mode==='hide'&&player&&!player.pending){const fw=[KD.KeyD,KD.KeyS,KD.KeyA,KD.KeyW];let k=0;Object.keys(KD).forEach(code=>{if(keys[code]){const h=KD[code];if(h===player.d)k=1;else if(h===(player.d+2)%4)k=-1;}});
        player.mul=k>0?1.45:k<0?.6:1;if(k){sus(player,dt*1.2);if(world.halt>0)sus(player,dt*3);}}
      if(mode==='seek')bots.forEach(b=>botThink(b,dt));}
    bumpT-=dt;if(bumpT<=0){bumpT=4+Math.random()*3;const n=world.boxes[(Math.random()*world.boxes.length)|0];if(n&&n.kind==='npc'){n.sus+=.5+Math.random()*.5;const m=meshes.get(n);if(m)m.bump=.35;}}
    world.step(dt);
    world.events.forEach(ev=>{
      if(ev.type==='spark')spark(ev.x,ev.y);
      if(ev.type==='missed'&&live&&ev.b===player)sus(player,DIFF[diffKey].miss);
      if(ev.type==='deliver'&&live){const b=ev.b;
        if(b===player){say(`출고 ${b.deliv}/3`);if(b.deliv>=3)end(true,`${Math.round((performance.now()-t0)/1000)}초 만에 세 번 출고, 직원 스캔 ${hunt.scans}번 남음.`,1000+Math.max(0,time)*10);}
        if(b.kind==='bot'&&b.deliv>=3){b.gone=true;escaped++;say('누군가 빠져나갔다…');checkSeekEnd();}}});
    const blink=world.sortWarn&&((world.sortT*8)|0)%2===0;
    dyn.forEach(o=>{if(o.k==='sort')o.bar.material.color.set(world.sortOn?'#ffd21f':blink?'#f7e27a':'#8a7a3a');
      else if(o.k==='turn')o.a.rotation.y=-world.turnDir(o.t,o.x,o.y)*Math.PI/2;
      else if(o.k==='jam')o.l.material.color.set(world.jamOpen(o.x,o.y)?'#2f9d55':'#d6322a');});
    sparks=sparks.filter(s=>{s.t-=dt;const k=1-s.t/.35;s.m.scale.setScalar(1+k*1.6);s.m.material.opacity=Math.max(0,s.t/.35);if(s.t<=0){S.remove(s.m);return false;}return true;});
    histT+=dt;const sample=histT>.1;if(sample)histT=0;
    world.boxes.forEach(b=>{const m=meshFor(b);if(b.gone||b.pending){m.g.visible=false;return;}m.g.visible=true;if(m.dest!==b.dest){m.dest=b.dest;m.lab.material=labelMats[b.dest];}
      const [x,y]=world.pos(b);let h=0;if(m.bump>0){m.bump-=dt;h=Math.abs(Math.sin(m.bump*30))*.15;}m.g.position.set(wx(x),h,wz(y));
      if(sample){b.hist.push([wx(x),wz(y)]);if(b.hist.length>50)b.hist.shift();}});
    if(trailT>0){trailT-=dt;if(trailT<=0)clearTrails();}
    if(mode==='hide'&&player&&!player.pending){const [x,y]=world.pos(player);const X=wx(x),Z=wz(y),h=player.size*.8+.33;
      meArrow.position.set(X,h+2,Z);meEdge.position.set(X,h+2.1,Z);meArrow.rotation.y+=dt*2;meEdge.rotation.y=meArrow.rotation.y;meRing.position.set(X,.4,Z);const s=1+.12*Math.sin(now/180);meRing.scale.set(s,s,s);
      if(live)huntStep(dt);}
    if(live&&time<=0){if(mode==='hide')end(false,`시간 끝. 출고 ${player.deliv}/3.`,player.deliv*100);else end(false,`시간 끝. 찾음 ${found}, 놓침 ${escaped}.`,found*1000);}
    if(live)updHud();}
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').hidden=true;}
  R.render(S,cam);requestAnimationFrame(frame);}
resize();menu();requestAnimationFrame(frame);
})();
</script>
