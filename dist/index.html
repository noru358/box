<meta charset="utf-8">
<title>택배 숨바꼭질</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
/* layout: 한 화면 게임. 위 상태줄(오른쪽 끝 일시정지), 가운데 3D 물류센터, 아래 모드별 도구줄, 메뉴·결과·기록은 덮는 판 */
:root{
  --floor:#e4dfd3; --ink:#1e1c18; --muted:#5f5a50; --card:#fffdf7; --line:#bfb8a8;
  --hazard:#f2c230; --alert:#d6322a; --me:#ff2bd6;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif; --f-big:'Black Han Sans','Apple SD Gothic Neo',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important} /* .panel 등의 display가 hidden을 덮지 않게(파일로 바로 열 때 메뉴판이 안 사라지던 문제) */
html,body{height:100%}
body{background:var(--floor);color:var(--ink);font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums;min-height:44px}
.bar b{font-weight:700}
.bar .sp{flex:1}
.meter{display:inline-block;vertical-align:middle;width:140px;height:10px;background:var(--line);position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--alert);width:0}
.meter s{position:absolute;left:37%;top:-3px;bottom:-3px;width:2px;background:var(--ink)} /* 이 선(의심 1.1)을 넘으면 빨간불에 찍힐 수 있음, 끝까지 차면 거의 확실 */
#susWrap .warn{display:none;color:var(--alert);font-weight:700}#susWrap.hot .warn{display:inline}
.sw{display:inline-block;width:18px;height:12px;vertical-align:middle;border:2px solid var(--ink)}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#d6d0c2;border:2px solid var(--ink);overflow:hidden}
.edge{position:absolute;transform:translateY(-50%);background:var(--hazard);color:var(--ink);font-weight:700;font-size:14px;padding:6px 10px;border:2px solid var(--ink);pointer-events:none}
.redtag{position:absolute;right:12px;top:10px;background:var(--alert);color:#fff;font-weight:700;font-size:13px;padding:4px 10px}
canvas{width:100%;height:100%;display:block;touch-action:none}
.panel{position:absolute;inset:0;background:rgba(30,28,24,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.box{background:var(--card);max-width:680px;width:100%;padding:20px 22px;display:flex;flex-direction:column;gap:12px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--hazard);max-height:100%;overflow:auto;box-sizing:border-box}
.box h1{margin:0;font-family:var(--f-big);font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.05}
.box h2{margin:4px 0 0;font-size:15px}
.box p{margin:0;line-height:1.6;font-size:14px;color:var(--muted)}
.keys{font-size:13px;line-height:1.75}
kbd{font-family:var(--f-ui);font-size:12px;border:1px solid var(--ink);padding:0 5px;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:13px;font-weight:600}
select,textarea{font-family:var(--f-ui);font-size:13px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
select{min-height:40px;padding:0 6px}
textarea{width:100%;box-sizing:border-box;min-height:64px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
button{font-family:var(--f-ui);font-weight:700;font-size:14px;min-height:44px;padding:0 14px;border:3px solid var(--ink);background:var(--hazard);color:var(--ink);cursor:pointer}
button.alt{background:#fff}
button.on{background:var(--ink);color:#fff}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--alert);outline-offset:2px}
.msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-right:10px;border-right:2px solid var(--line)}
.tools .grp:last-child{border-right:0}
.tools button{min-height:40px;font-size:13px;padding:0 10px}
.note{font-size:13px;color:var(--muted);line-height:1.6;max-width:80ch;margin:0}
button{touch-action:manipulation}
.stage{-webkit-user-select:none;user-select:none}
.touch{position:absolute;inset:0;pointer-events:none;display:none}
.touch button{pointer-events:auto;position:absolute;opacity:.92}
.touch .tl{left:8px;top:8px;min-height:40px;font-size:13px}
.touch .br{right:10px;bottom:10px;min-height:64px;min-width:120px;font-size:17px}
.touch .hint{position:absolute;left:10px;bottom:10px;background:rgba(30,28,24,.7);color:#fff;font-size:12px;padding:4px 8px}
/* 터치 기기: 무대를 화면 높이에 맞추고, 아래 도구줄 대신 무대 위 버튼 */
@media (pointer:coarse){
  body{padding-block:4px}
  .wrap{gap:4px}
  .bar{font-size:12px;min-height:28px;gap:4px 12px}
  .tools,#ver{display:none!important}
  .bar #pauseBtn{min-height:30px;font-size:12px;padding:0 10px;border-width:2px}
  .stage{aspect-ratio:auto;height:calc(100dvh - 52px)}
  .touch{display:block}
  .meter{width:70px}
}
/* 폰: 무대가 상태줄 아래 화면 전체를 쓴다(세로·가로 모두). 메뉴·결과 판은 화면 전체로 펼친다 */
@media (pointer:coarse){
  .wrap{height:calc(100dvh - 8px)}
  .stage{flex:1;min-height:0;height:auto}
  .panel{position:fixed;inset:0;z-index:8;padding:0;background:var(--card)}
  .box{max-width:none;width:100%;height:100%;max-height:none;border:0;box-shadow:none;padding:20px max(16px,env(safe-area-inset-left,0px)) 28px;overflow:auto}
}

</style>

<div class="wrap">
  <div class="bar">
    <span id="modeL"><b>대기 중</b></span>
    <span id="timeWrap" hidden>남은 시간 <b id="timeL">-</b></span>
    <span id="goalL"></span>
    <span id="susWrap" hidden>직원 눈길 <span class="meter"><i id="susBar"></i><s></s></span> <small class="warn">찍힐 수 있음</small></span>

    <button class="alt" id="pauseBtn" hidden>일시정지</button>

    <div class="msg" id="msg" hidden></div><div class="edge" id="edgeMark" hidden></div><div class="redtag" id="redTag" hidden>직원이 보는 중</div>
    <div class="touch" id="touch"><button class="alt tl" id="tPause" hidden>일시정지</button><button class="br" id="tLook" hidden>돌아보기</button><span class="hint" id="tHint" hidden>옆 레일 쪽으로 밀거나 톡 눌러서 이동</span></div>

  <div class="tools" id="hideTools" hidden>

  </div>
  <div class="tools" id="seekTools" hidden>
    <button id="lookBtn">돌아보기 (Space)</button>

  </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== src/engine.js =====
// ===== 택배 숨바꼭질 엔진 (규칙만, 화면 없음) =====
// 브라우저에선 빌드 때 dist/index.html 안에 들어가고, node에선 require로 불러 테스트한다.
// 설계 설명: docs/2-design/engine.md, ai.md, balance.md
const DIRS='>v<^',DX=[1,0,-1,0],DY=[0,1,0,-1];
const BASE=1.25; // 벨트 속도(칸/초)
const WANDER=.45; // 분기 칸이 없는 맵에서 일반 상자가 초록에 옆으로 옮기는 빈도(초당, 한 초록에 한 번까지)
// 분기 칸(v12-switch): 'W' 기호. 일반 상자는 분기 칸에서만 옆 레일로 간다(지날 때 SW_P 확률, 초록일 때).
// 미끼: 분기 칸 바로 앞뒤 칸에서 SW_BAIT 확률로 넘어가는 일반 상자도 있다. 사람은 어디서든 넘어갈 수 있지만 분기 칸이 아니면 티가 난다.
const SW_P=.55,SW_BAIT=.06;
// 터널: 'U' 기호. 덮개 아래라 찾는 쪽에게 안 보인다. 터널 안에서 터널 안으로 넘어가면 안 보이고 걸리지도 않는다. 일반 상자도 터널을 지날 때 TUN_P 확률로 한 번 안에서 갈아탄다(나온 줄이 바뀐 게 확실한 증거가 되지 않게).
const TUN_P=.12; // 터널을 한 번 지날 때 안에서 갈아탈 확률(칸마다가 아니라 한 번)
const DIFF={easy:{name:'쉬움',yellow:.65,late:.35,green:[1.6,4.2],red:[1.4,2.4],fake:.12,aim:1.0,slack:1.6,k:1.4},normal:{name:'보통',yellow:.45,late:.22,green:[1.0,3.8],red:[1.6,2.8],fake:.2,aim:.75,slack:1.25,k:1},hard:{name:'어려움',yellow:.3,late:.12,green:[.6,3.4],red:[1.8,3.2],fake:.3,aim:.55,slack:1.0,k:.7}};
// 가로 레일 맵: rows = [{d:'>'|'<', ex:{열:기호}}], 양 끝은 입고·출고
function laneMap(rows,W){W=W||14;const g=[Array(W).fill('..')];
  rows.forEach(r=>{const t=Array(W).fill('n'+r.d);const right=r.d==='>';t[right?0:W-1]='I'+r.d;t[right?W-1:0]='X'+r.d;Object.entries(r.ex||{}).forEach(([k,v])=>t[+k]=v);g.push(t);});
  g.push(Array(W).fill('..'));return g.map(r=>r.join(' ')).join('/');}
// 굽은 길(v12-switch 시험): 바깥 고리(시계 방향)와 안쪽 고리(반시계) + 가운데 두 줄(입고→출고). 세로로 흐르는 길, 모퉁이, 세로 터널.
function loopMap(){const W=14,H=8,g=Array.from({length:H},()=>Array(W).fill('..'));const set=(x,y,t)=>{g[y][x]=t;};
  for(let x=1;x<=11;x++)set(x,1,'n>');set(12,1,'nv');for(let y=2;y<=5;y++)set(12,y,'nv');set(12,6,'n<');for(let x=2;x<=11;x++)set(x,6,'n<');set(1,6,'n^');for(let y=2;y<=5;y++)set(1,y,'n^');
  for(let x=3;x<=11;x++)set(x,2,'n<');set(2,2,'nv');for(let y=3;y<=4;y++)set(2,y,'nv');set(2,5,'n>');for(let x=3;x<=10;x++)set(x,5,'n>');set(11,5,'n^');for(let y=3;y<=4;y++)set(11,y,'n^');
  set(3,3,'I>');for(let x=4;x<=9;x++)set(x,3,'n>');set(10,3,'X>');set(10,4,'I<');for(let x=4;x<=9;x++)set(x,4,'n<');set(3,4,'X<');
  [[5,1,'W>'],[9,1,'W>'],[4,6,'W<'],[8,6,'W<'],[6,2,'W<'],[7,5,'W>'],[1,3,'W^'],[2,4,'Wv'],[6,3,'W>'],[7,4,'W<'],[12,3,'Uv'],[12,4,'Uv'],[11,3,'U^'],[11,4,'U^']].forEach(([x,y,t])=>set(x,y,t));
  return g.map(r=>r.join(' ')).join('/');}
const MAPS={
  compact:{name:'세로 폰용(9칸)',str:laneMap([{d:'>',ex:{2:'W>',6:'W>'}},{d:'<',ex:{3:'W<',6:'W<'}},{d:'>',ex:{2:'W>',5:'W>'}},{d:'>',ex:{2:'W>',4:'U>',5:'U>',7:'W>'}},{d:'>',ex:{2:'W>',4:'U>',5:'U>',7:'W>'}},{d:'<',ex:{3:'W<',6:'W<'}},{d:'>',ex:{2:'W>',5:'W>'}}],9)},
  loop:{name:'굽은 길',str:loopMap()},
  switch:{name:'분기',str:laneMap([{d:'>',ex:{3:'W>',7:'W>',11:'W>'}},{d:'<',ex:{5:'W<',9:'W<'}},{d:'>',ex:{3:'W>',6:'U>',7:'U>',8:'U>',11:'W>'}},{d:'>',ex:{5:'W>',6:'U>',7:'U>',8:'U>',9:'W>'}}])}
};
// 칸 종류 등록표. 맵 기호는 [종류 한 글자][방향 > v < ^]. 새 칸 종류는 여기 한 줄 + 화면 쪽 TILE_LOOK(그리는 법) 한 줄.
// 칸 객체: {k: 등록표 키, t: 'belt'|'spawn'|'exit'(움직임 규칙), d: 방향, sw: 분기 칸, tun: 터널}
const TILES={
  belt:{sym:'n',name:'벨트',make:d=>({t:'belt',d})},
  switch:{sym:'W',name:'분기',make:d=>({t:'belt',d,sw:true})},
  tunnel:{sym:'U',name:'터널',make:d=>({t:'belt',d,tun:true})},
  spawn:{sym:'I',name:'입고',make:d=>({t:'spawn',d})},
  exit:{sym:'X',name:'출고',make:d=>({t:'exit',d})}
};
const TILE_OF_SYM={};for(const k in TILES)TILE_OF_SYM[TILES[k].sym]=k;
function parseTile(tok){if(!tok||tok==='..')return null;const k=TILE_OF_SYM[tok[0]],d=DIRS.indexOf(tok[1]);if(!k||d<0)return null;return Object.assign(TILES[k].make(d),{k});}
function tileToken(t){return t?TILES[t.k].sym+DIRS[t.d]:'..';}
function parseMap(str){const rows=str.trim().split('/').map(r=>r.trim().split(/\s+/));const H=rows.length,W=Math.max(...rows.map(r=>r.length));
  return {W,H,tiles:rows.map(r=>Array.from({length:W},(_,x)=>parseTile(r[x])))};}
function mapToStr(m){return m.tiles.map(r=>r.map(tileToken).join(' ')).join('/');}

function createWorld(str,opt){opt=opt||{};const rng=opt.rng||Math.random;const {W,H,tiles}=parseMap(str);const diff=DIFF[opt.diff||'normal'];
  const cells=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(tiles[y][x])cells.push([x,y]);
  const spawns=cells.filter(([x,y])=>tiles[y][x].t==='spawn');
  // puppet: 친구와 하기의 상자 쪽 화면. 일반 상자의 결정·재입고는 직원(방장) 화면이 하고, 여기선 벨트만 굴리며 받은 상태로 덮어쓴다
  const puppet=!!opt.puppet;
  const w={W,H,tiles,diff,puppet,boxes:[],t:0,light:'green',lightT:0,win:0,events:[]};
  const T=(x,y)=>(x>=0&&y>=0&&x<W&&y<H)?tiles[y][x]:null;w.T=T;
  const wrap=(x,y)=>[(x+W)%W,(y+H)%H];
  const hopable=t=>t&&t.t!=='exit';
  w.isSwitch=(x,y)=>{const t=T(x,y);return !!(t&&t.sw);};
  w.isTunnel=(x,y)=>{const t=T(x,y);return !!(t&&t.tun);};
  // 터널 안에서 터널 안으로 갈 수 있는 옆 방향(-1 = 없음)
  w.tunSide=b=>{if(!w.isTunnel(b.cx,b.cy))return -1;const d=T(b.cx,b.cy).d;const o=[(d+1)%4,(d+3)%4].filter(h=>w.isTunnel(b.cx+DX[h],b.cy+DY[h]));return o.length?o[(rng()*o.length)|0]:-1;};
  // 분기 칸 바로 앞이나 뒤(같은 레일)인가: 미끼 자리
  w.nearSwitch=(x,y)=>{const t=T(x,y);if(!t||t.sw)return false;return w.isSwitch(x+DX[t.d],y+DY[t.d])||w.isSwitch(x-DX[t.d],y-DY[t.d]);};
  w.hasSwitches=cells.some(([x,y])=>tiles[y][x].sw);
  // 넘어갈 수 있는 옆 방향 중 아무거나(-1 = 못 감)
  w.randSide=b=>{const t=T(b.cx,b.cy);if(!hopable(t))return -1;const o=[(t.d+1)%4,(t.d+3)%4].filter(h=>hopable(T(b.cx+DX[h],b.cy+DY[h])));return o.length?o[(rng()*o.length)|0]:-1;};
  w.add=function(kind){const free=cells.filter(([x,y])=>!w.boxes.some(b=>!b.gone&&b.cx===x&&b.cy===y)&&tiles[y][x].t!=='exit');if(!free.length)return null;const [x,y]=free[(rng()*free.length)|0];
    const b={id:w.boxes.length,kind,size:[1.25,1.5,1.75][(rng()*3)|0],cx:x,cy:y,d:tiles[y][x].d,s:rng()*.9,follow:1,sus:0,deliv:0,gone:false,found:false,pending:false,slide:null,lastWin:-1};
    w.boxes.push(b);return b;};
  w.center=(x,y)=>[x,y];
  w.pos=b=>{let x=b.cx+DX[b.d]*b.s,y=b.cy+DY[b.d]*b.s;if(b.slide){const k=1-Math.min(1,b.slide.t);x+=b.slide.ox*k;y+=b.slide.oy*k;}return [x,y];};
  w.midMove=b=>!!(b.slide&&b.slide.t<1);
  function respawn(b){if(puppet){b.pending=true;return;}const free=spawns.filter(([x,y])=>!w.boxes.some(o=>o!==b&&!o.gone&&!o.pending&&Math.hypot(o.cx+DX[o.d]*o.s-x,o.cy+DY[o.d]*o.s-y)<1));
    if(!free.length){b.pending=true;return;}const [x,y]=free[(rng()*free.length)|0];b.cx=x;b.cy=y;b.d=tiles[y][x].d;b.s=0;b.pending=false;b.slide=null;}
  // 칸 중앙 도착: 다음 방향을 정한다
  function arrive(b){const t=tiles[b.cy][b.cx];
    if(t.t==='exit'){b.deliv++;w.events.push({type:'deliver',b});respawn(b);return;}
    b.d=t.d;}
  // 신호: 초록(등 돌림) → 노랑(돌아보는 중) → 빨강(봄)
  w.setLight=function(s){if(w.light===s)return;w.light=s;w.lightT=0;if(s==='green')w.win++;
    if(s==='red')for(const b of w.boxes){if(b.gone||b.pending)continue;if(b.slide&&b.slide.hid)continue;if(w.midMove(b))w.events.push({type:'frozen',b,x:w.pos(b)[0],y:w.pos(b)[1]});}
    w.events.push({type:'light',s});};
  // 사람 상자의 옆 칸 갈아타기
  w.thud=function(b,move,sw,tun){const [x,y]=w.pos(b);const off=w.light==='red'&&!tun;if(move)b.lastWin=w.win;w.events.push({type:'thud',b,x,y,off,sw:!!sw,tun:!!tun});return off;}; // sw: 분기 칸에서 넘어갔나

let swipe=null;const SWIPE=22;
// 화면 방향(오른쪽 +x, 아래 +y) → 세계 방향(0~3). 카메라가 돌아가도(세로 화면) 내가 민 쪽으로 간다
const sdA=new THREE.Vector3(),sdB=new THREE.Vector3();

  sdA.set(wx(x),.5,wz(y)).project(cam);let best=-1,bd=-2;const sl=Math.hypot(sx,sy)||1;
  for(const h of only||[0,1,2,3]){sdB.set(wx(x+DV[h][0]),.5,wz(y+DV[h][1])).project(cam);const vx=(sdB.x-sdA.x)*(cam.aspect||1),vy=-(sdB.y-sdA.y),L=Math.hypot(vx,vy);const dot=(vx*sx+vy*sy)/(L*sl);if(isFinite(dot)&&dot>bd){bd=dot;best=h;}}

// 숨는 쪽 판에서 내 입력을 신호 기준으로 남긴다. 초록 한 번 = 창(window) 하나:
// {need: 초록 시작 때 노리는 코인 경계 레일까지 남은 줄 수(0,1,2=2 이상), g: 그 초록의 길이(초), hops: [{ph: 'g'|'y'|'r' 옮긴 순간의 신호, t: 그 신호가 켜진 뒤 초, dir: 1 코인 쪽(건너기 포함), -1 반대쪽, 0 코인 없음}]}
// 아무것도 안 한 초록도 창으로 남긴다(사람이 기다린 것도 패턴이다). 판이 끝나면 저장: 아티팩트에선 공유 db(plays), 아니면 이 브라우저.
const HUMAN_VER=5,HUMAN_KEY='box-human5'; // 5: 코인이 경계로 바뀌어 need·dir 뜻이 바뀜(v13.5) // 사람 창이 이만큼 모이면 숨은 AI가 사람 기록을 쓴다

function recLight(s){if(!rec||!player)return;const now=world.t;
  if(rec.cur&&rec.cur.ph==='g'&&s!=='green')rec.cur.g=+(now-rec.cur.t0).toFixed(2);
  if(s==='green'){recClose();rec.cur={need:needOf(world,player),g:0,hops:[],t0:now,ph:'g'};}else if(rec.cur)rec.cur.ph=s;rec.ps=now;}
function recHop(dir,sw,tun){if(!rec||!rec.cur)return;const h={ph:world.light==='green'?'g':world.light==='yellow'?'y':'r',t:+(world.t-rec.ps).toFixed(2),dir};h.sw=sw?1:0;if(tun)h.tun=1;rec.cur.hops.push(h);}
function recClose(){if(rec&&rec.cur){const c=rec.cur;if(!c.g)c.g=+(world.t-c.t0).toFixed(2);rec.wins.push({need:c.need,g:c.g,hops:c.hops});rec.cur=null;}}
function recSave(win){if(!rec)return;recClose();const play={v:HUMAN_VER,at:Date.now(),map:curKey,win:!!win,got:player?player.got||0:0,wins:rec.wins.slice(0,60)};rec=null;if(!play.wins.length)return;
  humanPlays.unshift(play);humanPlays=humanPlays.slice(0,80);
  try{const L=JSON.parse(localStorage.getItem(HUMAN_KEY)||'[]');L.unshift(play);localStorage.setItem(HUMAN_KEY,JSON.stringify(L.slice(0,40)));}catch(e){}
  if(DB){DB.collection('plays').add(play).catch(()=>{});}}
// 기록 판들을 창 하나씩으로 편다. humanPlays가 바뀔 때만 다시 편다(매 프레임 4천 개 넘게 펴던 것)
let _hw=[],_hwOf=null;const humanWins=()=>{if(_hwOf!==humanPlays){_hwOf=humanPlays;_hw=humanPlays.flatMap(p=>Array.isArray(p.wins)?p.wins:[]).filter(w=>w&&Array.isArray(w.hops));}return _hw;};
const aiCtx=()=>({humanWins:humanWins(),time,diff:DIFF[DIFF_KEY]});
try{const L=JSON.parse(localStorage.getItem(HUMAN_KEY)||'[]');if(Array.isArray(L)&&L.length){humanPlays=L;humanSrc='local';}}catch(e){}
// 아티팩트로 열었을 때: 공유 db에서 최근 기록을 읽는다(10초 안에 답 없으면 이 브라우저 기록만)

function huntStep(dt){const p=player;worker.position.z=wz(H-1)+CS*.9;const stunned=hunt.stun>0;
  const r=hunterStep(world,hunt,dt,DIFF[DIFF_KEY]),t=hunt.target;
  if(t){const [tx,ty]=world.pos(t);worker.position.x+=(THREE.MathUtils.clamp(wx(tx),wx(0),wx(W-1))-worker.position.x)*dt*1.5;ring.visible=laser.visible=true;ring.position.set(wx(tx),.38,wz(ty));
    laser.geometry.setFromPoints([new THREE.Vector3(worker.position.x,2.4,worker.position.z),new THREE.Vector3(wx(tx),t.size*.8+.33,wz(ty))]);}
  else{ring.visible=laser.visible=false;if(!stunned){const [ppx]=world.pos(p);worker.position.x+=(THREE.MathUtils.clamp(wx(ppx)*.4,wx(0),wx(W-1))-worker.position.x)*dt*.6;}}
  if(r){if(r.scan===p){end(false,`코인 ${p.got}/${goal}에서 스캐너에 찍힘.`);return;}say('직원: 아… 그냥 상자네');hunt.stun=3;r.scan.sus=0;}}

// ===== src/view/net.js =====

const NET_MAP='compact';let net=null,ROOM=null,roomState='wait';
(async()=>{try{const c=window.claude;if(!c||!c.use){roomState='none';return;}ROOM=await c.use('room');roomState=ROOM?'ok':'none';}catch(e){roomState='none';}if(mode===null&&$('netNote'))$('netNote').textContent=netNote();})();
function netNote(){return roomState==='none'?'실시간 방에 연결할 수 없어요. claude.ai에 로그인해서 연 링크(초대받은 사람)끼리만 돼요.':roomState==='wait'?'방 연결 확인 중…':'같은 링크를 연 친구와 1:1. 술래와 숨는 쪽은 방에서 바꿀 수 있어요.';}
const myPeer=()=>{const m=ROOM&&ROOM.peers().find(p=>p.sameTab);return m?m.peer:null;};
const otherOf=peers=>peers.find(p=>!p.sameTab&&p.presence&&p.presence.nb);
function netPush(patch){if(!net)return;Object.assign(net.me,patch);ROOM.presence(patch).catch(e=>{if(e&&e.code==='invalid_argument')console.warn('presence',e.message);});}
function setRole(r){net.r=r;net.role=r==='seek'?'host':'hider';netPush({r});}
function netOpen(){if(!ROOM){say(roomState==='wait'?'방 연결 확인 중이에요. 잠시 뒤 다시':'실시간 방에 연결할 수 없어요',2.5);return;}
  if(net)netLeave();const o=otherOf(ROOM.peers()),r=o&&o.presence.r==='seek'?'hide':'seek';
  net={r,role:r==='seek'?'host':'hider',me:{},ep:0,seen:0,q:[],seq:0,hopAt:0,snapT:0,frozen:false,sw:0,swSeen:0,peer:null,al:0,alSeen:0,cg:[]};
  net.unsub=ROOM.onPeers(ch=>netPeers(ch.peers));

function netLeave(){if(!net)return;const n=net;net=null;if(n.unsub)n.unsub();ROOM.presence({nb:null,r:null,sw:null,ph:null,map:null,ep:null,as:null,snap:null,q:null,al:null,cg:null,res:null,win:null}).catch(()=>{});}
function netLobby(){if(!net)return;idleUi('<b>친구와 1:1</b>');curKey=NET_MAP;if(!world||world.puppet)newWorld();
  if(net.r==='seek')netPush({ph:'lobby',snap:null,res:null});
  $('panelBox').innerHTML=`<h1>친구와 1:1</h1><p id="lobbyL"></p><div class="row"><button id="netGo">시작</button><button class="alt" id="netSw">역할 바꾸기</button><button class="alt" id="toMenu">나가기</button></div>`;
  $('netGo').onclick=netStart;$('netSw').onclick=()=>{net.sw++;netPush({sw:net.sw});setRole(net.r==='seek'?'hide':'seek');lobbyText();};$('toMenu').onclick=()=>menu();netPeers(ROOM.peers());}
function lobbyText(o){if(!$('lobbyL'))return;o=o||otherOf(ROOM.peers());const nm=r=>r==='seek'?'술래(직원)':'숨는 쪽(상자)';
  $('lobbyL').textContent=!o?`나는 ${nm(net.r)}. 친구를 기다리는 중… 친구가 같은 링크에서 "친구와 1:1"을 누르면 들어와요.`:`나는 ${nm(net.r)}, 친구는 ${nm(o.presence.r)}. `+(net.r==='seek'?'시작을 누르면 같이 시작해요.':'술래가 시작하면 바로 시작해요.');
  $('netGo').hidden=net.r!=='seek';$('netGo').disabled=!o;}
function netStart(){if(!net||net.r!=='seek')return;const o=otherOf(ROOM.peers());if(!o||o.presence.r!=='hide'){say('숨는 쪽 친구가 아직 없어요',2);return;}
  curKey=NET_MAP;start('seek');if(mode!=='seek')return;
  bots.slice(1).forEach(b=>{b.kind='npc';b.coin=null;});bots=bots.slice(0,1); // 1:1이라 AI 숨은 상자는 없다
  const b=bots[0];b.remote=o.peer;b.src='friend';
  net.ep=Date.now()%1e9;net.seen=Math.max(0,...((o.presence.q||[]).map(x=>x[0])));net.alSeen=o.presence.al||0;
  net.snapT=0;netPush({ph:'play',map:curKey,ep:net.ep,as:[[o.peer,b.id]],snap:netSnap(),res:null,win:null});}
function netSnap(){world.boxes.forEach(b=>{const m=meshes.get(b);b.alert=!!(m&&m.alert);});
  return {t:+time.toFixed(1),L:world.light,lt:+world.lightT.toFixed(2),pz:paused?1:0,bx:world.packBoxes(),po:coins.map(c=>[c.id,c.a[0],c.a[1],c.h,+c.t.toFixed(1)]),hs:bots.map(b=>[b.id,b.got|0,[...(b.took||[])],b.found?1:0,b.gone?1:0]),sc:[found,escaped,scans]};}
function remoteHop(b,h){if(b.found||b.gone||b.pending||mode!=='seek'||over)return;if(world.midMove(b)){b.q={h,t:performance.now()};return;}if(h%2!==b.d%2)world.hop(b,h);}
function netCoin(id){net.cg=[...net.cg,[net.ep,id]].slice(-8);netPush({cg:net.cg});}
function netHop(h){net.hopAt=performance.now();net.q=[...net.q,[++net.seq,h]].slice(-8);netPush({q:net.q});}
function netAlert(){net.al++;netPush({al:net.al});}
function netPeers(peers){if(!net)return;const o=otherOf(peers),P=o?o.presence:null,idle=mode===null||over;
  if(!o)net.peer=null;else if(net.peer!==o.peer){net.peer=o.peer;net.swSeen=P.sw||0;}
  if(P&&(P.sw||0)>net.swSeen){net.swSeen=P.sw;if(idle)setRole(net.r==='seek'?'hide':'seek');} // 친구가 역할 바꾸기를 누르면 나도 바뀐다
  // 동시에 들어와 역할이 겹치면 peer 순서로 나눈다. 바꾸기 직후 친구가 아직 안 바뀐 순간은 겹침이 아니므로 1초 이어질 때만
  if(P&&idle&&P.r===net.r){if(!net.clash)net.clash=setTimeout(()=>{if(!net)return;net.clash=null;const ps=ROOM.peers(),q=otherOf(ps),me=myPeer();if(q&&q.presence.r===net.r&&(mode===null||over)){setRole(me&&me<q.peer?'seek':'hide');if(mode===null)lobbyText(q);}},1000);}
  if(mode===null)lobbyText(o);
  if(net.role==='host'){if(mode!=='seek'||over)return;const b=bots[0];
    if(!o||o.peer!==b.remote||P.r!=='hide'){end(false,'친구가 나갔어요.');return;}
    for(const [n,h] of (P.q||[]))if(n>net.seen){net.seen=n;remoteHop(b,h);}
    for(const [ep,id] of (P.cg||[]))if(ep===net.ep&&!b.took.has(id)){b.took.add(id);b.got=(b.got|0)+1;coinScored(b);if(over)return;}
    if((P.al||0)>net.alSeen){net.alSeen=P.al;alertOn(b);}
    return;}
  // 숨는 쪽
  if(!o||P.r!=='seek'){if(mode==='hide'&&!over)end(false,'친구가 나갔어요.');return;}
  if(P.ph==='play'&&P.ep!==net.ep&&P.snap){const a=(P.as||[]).find(x=>x[0]===myPeer());if(a&&idle){net.ep=P.ep;startRemote(P.map,a[1],P.snap);}return;}
  if(P.ep!==net.ep||mode!=='hide')return;
  if(P.ph==='play'&&P.snap)applySnap(P.snap);
  else if(P.ph==='end'&&!over){if(P.snap)applySnap(P.snap);if(!over)end(!P.win,(P.win?'술래가 찾았다. ':'끝까지 안 들켰다. ')+(P.res||''));} // 숨는 쪽 결과 = 술래 결과의 반대
  else if(P.ph==='lobby'&&!over)end(false,'술래가 판을 끝냈어요.');}
function startRemote(mapKey,id,snap){goFull();initSound();if(mapList().some(m=>m.k===mapKey))curKey=mapKey;mode='hide';over=false;paused=false;
  world=createWorld(curEntry().str,Object.assign(wopt(),{puppet:true}));buildTiles(world.tiles);clearMeshes();fitCam();clearCoins();
  goal=COIN_GOAL;time=snap.t;scans=6;found=0;escaped=0;hunt={t:0,target:null,aim:0,scans:snap.sc[2],stun:0};bots=[];hideMarks();rec=null;hopQ=null;
  world.loadBoxes(snap.bx);world.light=snap.L;world.lightT=snap.lt;player=world.boxes.find(b=>b.id===id);player.kind='player';player.got=0;player.took=new Set();
  meArrow.visible=true;applySnap(snap);
  playUi('hide','<b>숨는 쪽</b> · 친구와 1:1');$('susWrap').hidden=true;say('친구가 술래. 코인 4개!',2);}
function applySnap(s){if(!world||!world.puppet||!player)return;time=s.t;net.frozen=!!s.pz;
  // 신호: 노랑은 받은 순간 켜고 빨강은 내 시계로(frame). 내가 이미 빨강이면 늦게 온 노랑은 무시
  if(s.L==='green'&&world.light!=='green')world.setLight('green');else if(s.L==='yellow'&&world.light==='green')world.setLight('yellow');else if(s.L==='red'&&world.light!=='red')world.setLight('red');
  // 덮어쓰기 전 화면 위치를 기억했다가, 0.8칸 안으로 튀면(출고 뒤 다시 나오는 건 그대로 순간 이동) 그 차이를 그리는 위치에서만 0.12초에 걸쳐 메운다(loop.js b.vo). 버벅임 원인이었음
  const before=new Map();world.boxes.forEach(b=>{if(!b.gone&&!b.pending){const [x,y]=world.pos(b);before.set(b,[x+(b.vo?b.vo[0]:0),y+(b.vo?b.vo[1]:0)]);}});
  world.loadBoxes(s.bx,b=>b===player&&performance.now()-net.hopAt<700); // 방금 내가 넘어간 건 술래 화면에 닿을 때까지 내 화면 그대로
  before.forEach((p,b)=>{if(b.gone||b.pending){b.vo=null;return;}const [x,y]=world.pos(b),dx=p[0]-x,dy=p[1]-y;b.vo=Math.hypot(dx,dy)<.8?[dx,dy]:null;});

  coins=s.po.map(([id,ax,ay,h,t])=>({id,a:[ax,ay],b:[ax+DX[h],ay+DY[h]],h,x:ax+DX[h]/2,y:ay+DY[h]/2,t}));syncCoins();
  hunt.scans=s.sc[2];const me=s.hs.find(h=>h[0]===player.id);
  if(me){if(me[1]>player.got)say(`코인 ${me[1]}/${goal}`);player.got=me[1];player.took=new Set([...me[2],...net.cg.filter(x=>x[0]===net.ep).map(x=>x[1])]);aimCoin(player); // 내가 방금 먹은 것(술래 확인 전)도 먹은 걸로
    if(me[3]&&!over){end(false,`코인 ${player.got}/${goal}에서 술래에게 찍힘.`,player.got*100);return;}
    if(me[4]&&!over){end(true,`코인 ${goal}개 모으고 빠져나감.`,1000);return;}}}


// ===== src/view/loop.js =====
// ===== 프레임 루프: 신호 → AI·입력 → 코인 → 엔진 한 걸음 → 이벤트 → 그리기 =====
let last=performance.now();
let fps=60;
// 숨은 상자가 코인을 먹었을 때: 나면 안내·승리, AI·친구 상자면 4개에 빠져나감
function coinScored(b){if(b===player){say(`코인 ${b.got}/${goal}`);if(b.got>=goal)end(true,`${Math.round((performance.now()-t0)/1000)}초 만에 코인 ${goal}개, 직원 스캔 ${hunt.scans}번 남음.`);}
  else if(b.got>=goal&&!b.gone){b.gone=true;escaped++;say('누군가 코인을 다 모으고 빠져나갔다…');checkSeekEnd();}}
function frame(now){const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;if(raw>0&&raw<1)fps+=(1/raw-fps)*.05; // 일시정지 화면에 보여 주는 평균 FPS
  const cl=!!(net&&net.role==='hider'&&mode==='hide'); // 친구와 하기의 상자 쪽: 규칙은 직원 화면이 정한다
  if(world&&!paused&&!(cl&&net.frozen)){const live=(mode==='hide'||mode==='seek')&&!over;
    if(live){time-=dt;
      const ctx=mode==='seek'?aiCtx():null;
      if(mode==='seek')bots.forEach(b=>{if(!b.T0)b.T0=time;if(b.remote){if(b.q&&!world.midMove(b)){const q=b.q;b.q=null;if(performance.now()-q.t<400)remoteHop(b,q.h);}}else botThink(world,b,dt,ctx);});
      if(mode==='seek'&&net&&net.role==='host'&&(net.snapT-=dt)<=0){net.snapT=.1;netPush({snap:netSnap()});}}
    // 터널에 들어간 줄과 나온 줄이 다르면 직원이 놓친다: 의심 0
    if(live&&mode==='hide'&&!cl)world.boxes.forEach(b=>{if(b.gone||b.pending)return;const it=inTun(b);if(it&&!b.wasTun)b.tunY=b.cy;if(!it&&b.wasTun&&b.tunY!=null&&b.cy!==b.tunY){b.sus=0;if(b===player)say('직원이 놓쳤다',1.2);}b.wasTun=it;});
    if(live&&mode==='hide'&&hopQ&&player&&!world.midMove(player)){const q=hopQ;hopQ=null;if(performance.now()-q.t<300)playerHop(q.h);}
    if(cl){if(live&&world.light==='yellow'&&world.lightT>=DIFF[DIFF_KEY].yellow)world.setLight('red');}else if(live&&mode==='hide'){sig(world,dt);
      const c=player.coin;if(c&&world.light==='green'&&world.lightT>.6&&world.boxes.some(b=>{if(b.gone||b.pending)return false;const [x,y]=world.pos(b);return Math.abs(x-c.x)<=1.5&&Math.abs(y-c.y)<=1.5;})&&Math.random()<dt*.9)world.setLight('yellow');} // 코인 근처에 상자가 있으면 AI 직원이 더 자주 돌아본다
    else if(live&&mode==='seek')seekSignal(dt);else if(!live)idleSig(world,dt);
    // 코인(engine.js coinStep): 수명 다 되면 옮기고, 이번 프레임 넘어가기 중 코인 경계를 지난 것을 먹는다.
    // 숨는 쪽 판은 나, 찾는 쪽 판은 AI 숨은 상자. 친구 상자는 친구 화면이 판정해 알려 온다(net.js)
    if(live&&!over&&!cl){const hid=mode==='hide'?[player]:bots.filter(b=>!b.remote);
      const got=coinStep(world,coins,dt,b=>hid.includes(b)&&!b.gone&&!b.found&&!b.pending);syncCoins();
      for(const [b] of got){coinScored(b);if(over)break;}
      if(!over)(mode==='hide'?[player]:bots).forEach(b=>{if(b&&!b.gone)aimCoin(b);});}
    world.step(dt);
    if(cl&&live&&!over)for(const c of coinTouched(world,player,coins))if(!player.took.has(c.id)){player.took.add(c.id);netCoin(c.id);say(`코인 ${player.got+1}/${goal}`);} // 친구와 하기: 코인도 숨는 쪽 화면이 판정해 알린다
    world.events.forEach(ev=>{
      if(cl&&live&&ev.b===player&&(ev.type==='frozen'||(ev.type==='thud'&&ev.off)))netAlert(); // 친구와 하기: 걸림은 숨는 쪽 화면이 정해서 알린다
      if(ev.type==='thud'){const m=meshes.get(ev.b);if(m)m.bump=.3;if(ev.off&&!ev.b.remote)alertOn(ev.b);if(live&&mode==='hide'&&ev.off)sus(ev.b,3.6);if(live&&mode==='hide'&&world.hasSwitches&&!ev.off&&!ev.sw&&!ev.tun)sus(ev.b,1.6);}
      if(ev.type==='deliver'&&ev.b.kind==='npc'){ev.b.pat=newPat();clearedOff(ev.b);} // 출고된 일반 상자는 새 상자로(무늬·확인 표시 새로)
      if(ev.type==='frozen'){if(!ev.b.remote)alertOn(ev.b);if(live&&mode==='hide'){sus(ev.b,3.2);if(ev.b===player)say('넘어가다 걸렸다!',1.2);}}
      if(ev.type==='light'){if(live)lightSound(ev.s);if(ev.s==='green')alertsOff();if(live&&mode==='hide')recLight(ev.s);if(live&&mode==='seek'&&ev.s==='green'){const ctx=aiCtx();bots.forEach(b=>{if(!b.found&&!b.gone&&!b.remote)botPlan(world,b,ctx);});}}});
    {const on=live&&world.light==='red';$('redTag').hidden=!on;if(on)$('redTag').textContent=mode==='seek'?`보는 중 ${Math.max(0,2.5-world.lightT).toFixed(1)}초 · 지금 옆으로 가는 상자는 !`:'직원이 보는 중';}
    floorLight(world.light,now); // 신호 = 바닥 조명
    world.events=[];

    world.boxes.forEach(b=>{const m=meshFor(b);if(b.gone||b.pending||inTun(b)){m.g.visible=false;return;}m.g.visible=true;
      let [x,y]=world.pos(b);if(b.vo){x+=b.vo[0];y+=b.vo[1];const k=Math.exp(-dt/.12);b.vo[0]*=k;b.vo[1]*=k;if(Math.abs(b.vo[0])+Math.abs(b.vo[1])<.01)b.vo=null;}let h=0;if(m.bump>0){m.bump-=dt;h=Math.abs(Math.sin(m.bump*30))*.15;}m.g.position.set(wx(x),h,wz(y));});
    coins.forEach((c,i)=>{const g=coinMeshes.get(c.id);if(!g)return;const k=g.userData.coin,f=Math.max(0,c.t/COIN_LIFE);
      g.visible=!(mode==='hide'&&player&&player.took&&player.took.has(c.id)); // 내가 먹은 코인은 내 화면에서만 지운다(남들 화면엔 그대로라 들통나지 않음)
      k.scale.y=k.scale.z=.6+.4*f;k.visible=!(c.t<3&&Math.floor(now/120)%2);
      k.quaternion.copy(cam.quaternion).multiply(coinQ);k.scale.x=(.25+.75*Math.abs(Math.cos(now/260+i)))*(.6+.4*f);k.position.y=1.1+.12*Math.sin(now/300+i);}); // 크기가 수명, 폭이 변하며 도는 것처럼(v13.5 모양) // 동전 면이 늘 카메라를 본다
    const hv=!!(hover&&mode==='seek'&&!over&&!hover.gone&&!hover.found);hoverRing.visible=hv;if(hv){const [hx,hy]=world.pos(hover);hoverRing.position.set(wx(hx),.42,wz(hy));}
    if(mode==='hide'&&player&&!player.pending){const [x,y]=world.pos(player);const X=wx(x),Z=wz(y),h=player.size*.8+.33;
      meArrow.position.set(X,h+1.4+.35*Math.sin(now/220),Z);meArrow.quaternion.copy(cam.quaternion);meArrow.scale.setScalar(1.35);
      if(live&&!cl)huntStep(dt);}
    if(live&&!cl&&time<=0){if(mode==='hide')end(false,`시간 끝. 코인 ${player.got}/${goal}.`);else end(false,`시간 끝. 찾음 ${found}, 놓침 ${escaped}.`);}
    if(live)updHud();}
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').hidden=true;}
  if(follow&&mode==='hide'&&player&&!player.pending){const [px]=world.pos(player);const tx=Math.max(follow.min,Math.min(follow.max,wx(px)));follow.cx+=(tx-follow.cx)*Math.min(1,dt*4);
    cam.position.set(follow.cx+follow.off.x,follow.off.y,follow.cz+follow.off.z);cam.lookAt(follow.cx,0,follow.cz);}
  {const e=$('edgeMark');let show=false;if(follow&&mode==='hide'&&player&&player.coin&&!over){edgeV.set(wx(player.coin.x),1,wz(player.coin.y)).project(cam);
    if(edgeV.x<-1||edgeV.x>1){show=true;const r=stage.getBoundingClientRect();e.textContent=edgeV.x<0?'◀ 코인':'코인 ▶';e.style.left=edgeV.x<0?'6px':'';e.style.right=edgeV.x<0?'':'6px';e.style.top=Math.max(40,Math.min(r.height-40,(1-edgeV.y)/2*r.height))+'px';}}
    e.hidden=!show;}
  R.render(S,cam);requestAnimationFrame(frame);}
// 테스트용 들여다보기(화면 흐름 테스트가 씀)
window.__box={scan:id=>{const b=world.boxes.find(o=>o.id===id);if(b&&mode==='seek'&&!over)scanBox(b);},s2w:(x,y)=>screenToWorld(x,y),human:{get plays(){return humanPlays.length;},get windows(){return humanWins().length;},get src(){return humanSrc;}},get bots(){return bots;},get mode(){return mode;},get player(){return player;},get world(){return world;},get over(){return over;},get net(){return net;},get time(){return time;},get coins(){return coins;}};
resize();menu();requestAnimationFrame(frame);

})();
