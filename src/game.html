<title>택배 숨바꼭질</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
/* layout: 한 화면 게임. 위 상태줄(오른쪽 끝 일시정지), 가운데 3D 물류센터, 아래 모드별 도구줄, 메뉴·결과·기록은 덮는 판 */
:root{
  --floor:#e4dfd3; --ink:#1e1c18; --muted:#5f5a50; --card:#fffdf7; --line:#bfb8a8;
  --hazard:#f2c230; --alert:#d6322a; --me:#ff2bd6;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif; --f-big:'Black Han Sans','Apple SD Gothic Neo',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important} /* .panel 등의 display가 hidden을 덮지 않게(파일로 바로 열 때 메뉴판이 안 사라지던 문제) */
html,body{height:100%}
body{background:var(--floor);color:var(--ink);font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums;min-height:44px}
.bar b{font-weight:700}
.bar .sp{flex:1}
.meter{display:inline-block;vertical-align:middle;width:140px;height:10px;background:var(--line);position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--alert);width:0}
.meter s{position:absolute;left:37%;top:-3px;bottom:-3px;width:2px;background:var(--ink)} /* 이 선(의심 1.1)을 넘으면 빨간불에 찍힐 수 있음, 끝까지 차면 거의 확실 */
#susWrap .warn{display:none;color:var(--alert);font-weight:700}#susWrap.hot .warn{display:inline}
.sw{display:inline-block;width:18px;height:12px;vertical-align:middle;border:2px solid var(--ink)}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#d6d0c2;border:2px solid var(--ink);overflow:hidden}
.stage.red{border-color:var(--alert);box-shadow:inset 0 0 0 4px var(--alert)}
.redtag{position:absolute;right:12px;top:10px;background:var(--alert);color:#fff;font-weight:700;font-size:13px;padding:4px 10px}
canvas{width:100%;height:100%;display:block;touch-action:none}
.panel{position:absolute;inset:0;background:rgba(30,28,24,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.box{background:var(--card);max-width:680px;width:100%;padding:20px 22px;display:flex;flex-direction:column;gap:12px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--hazard);max-height:100%;overflow:auto;box-sizing:border-box}
.box h1{margin:0;font-family:var(--f-big);font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.05}
.box h2{margin:4px 0 0;font-size:15px}
.box p{margin:0;line-height:1.6;font-size:14px;color:var(--muted)}
.keys{font-size:13px;line-height:1.75}
kbd{font-family:var(--f-ui);font-size:12px;border:1px solid var(--ink);padding:0 5px;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:13px;font-weight:600}
select,textarea{font-family:var(--f-ui);font-size:13px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
select{min-height:40px;padding:0 6px}
textarea{width:100%;box-sizing:border-box;min-height:64px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
button{font-family:var(--f-ui);font-weight:700;font-size:14px;min-height:44px;padding:0 14px;border:3px solid var(--ink);background:var(--hazard);color:var(--ink);cursor:pointer}
button.alt{background:#fff}
button.on{background:var(--ink);color:#fff}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--alert);outline-offset:2px}
.msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-right:10px;border-right:2px solid var(--line)}
.tools .grp:last-child{border-right:0}
.tools button{min-height:40px;font-size:13px;padding:0 10px}
.cbtn{width:40px;padding:0!important}
.note{font-size:13px;color:var(--muted);line-height:1.6;max-width:80ch;margin:0}
table{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted)}
.tw{overflow-x:auto}
button{touch-action:manipulation}
.stage{-webkit-user-select:none;user-select:none}
.touch{position:absolute;inset:0;pointer-events:none;display:none}
.touch button{pointer-events:auto;position:absolute;opacity:.92}
.touch .tl{left:8px;top:8px;min-height:40px;font-size:13px}
.touch .br{right:10px;bottom:10px;min-height:64px;min-width:120px;font-size:17px}
.touch .hint{position:absolute;left:10px;bottom:10px;background:rgba(30,28,24,.7);color:#fff;font-size:12px;padding:4px 8px}
.rotate{position:fixed;inset:0;z-index:9;background:var(--ink);color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:700;padding:24px;line-height:1.6}
/* 터치 기기: 무대를 화면 높이에 맞추고, 아래 도구줄 대신 무대 위 버튼 */
@media (pointer:coarse){
  body{padding-block:4px}
  .wrap{gap:4px}
  .bar{font-size:12px;min-height:28px;gap:4px 12px}
  .tools,#ver{display:none!important}
  .bar #pauseBtn{min-height:30px;font-size:12px;padding:0 10px;border-width:2px}
  .stage{aspect-ratio:auto;height:calc(100dvh - 52px)}
  .touch{display:block}
  .meter{width:70px}
}
/* 폰 세로: 가로 화면 그대로(레일 가로) 위에 두고, 남는 아래를 큰 조작 버튼으로 */
.pad{display:none}
@media (pointer:coarse) and (orientation:portrait){
  .stage{height:auto;aspect-ratio:16/10}
  .touch .br{display:none}
  .pad{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0}
  .pad button{min-height:0;height:100%;font-size:22px;border-width:3px}
  .pad #pLook{grid-column:1/-1}
  .wrap{min-height:calc(100dvh - 8px)}
}

</style>

<div class="wrap">
  <div class="bar">
    <span id="modeL"><b>대기 중</b></span>
    <span id="timeWrap" hidden>남은 시간 <b id="timeL">-</b></span>
    <span id="goalL"></span>
    <span id="susWrap" hidden>직원 눈길 <span class="meter"><i id="susBar"></i><s></s></span> <small class="warn">찍힐 수 있음</small></span>
    <span class="sp"></span>
    <button class="alt" id="pauseBtn" hidden>일시정지</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="물류센터 컨베이어 위 택배 상자들"></canvas>
    <div class="msg" id="msg" hidden></div><div class="redtag" id="redTag" hidden>직원이 보는 중</div>
    <div class="touch" id="touch"><button class="alt tl" id="tPause" hidden>일시정지</button><button class="br" id="tLook" hidden>돌아보기</button><span class="hint" id="tHint" hidden>옆 레일 쪽으로 밀거나 톡 눌러서 이동</span></div>
    <div class="panel" id="panel"><div class="box" id="panelBox"></div></div>
  </div>
  <div class="pad" id="pad"><button class="alt" id="pUp" hidden>▲ 위 레일</button><button class="alt" id="pDown" hidden>▼ 아래 레일</button><button id="pLook" hidden>돌아보기</button></div>
  <div class="tools" id="hideTools" hidden>
    <div class="grp"><button class="alt" data-hop="3">↑ W</button><button class="alt" data-hop="1">↓ S</button><button class="alt" data-hop="2">← A</button><button class="alt" data-hop="0">→ D</button></div>
    <div class="grp"><button class="alt" id="fakeBtn">걸린 척 (C)</button></div>
  </div>
  <div class="tools" id="seekTools" hidden>
    <button id="lookBtn">돌아보기 (Space)</button>
    <span class="note">우클릭(길게 누르기)으로 의심 상자에 핀</span>
  </div>
  <div class="tools" id="editTools" hidden>
    <div class="grp" id="palette"></div>
    <div class="grp"><button class="alt" id="rotBtn">방향 →</button><button class="alt" id="sideBtn">옆: 오른쪽</button></div>
    <div class="grp" id="colorPick"></div>
    <div class="grp"><button id="editDone">편집 끝</button></div>
  </div>
  <p class="note" id="ver">v12-switch 시험 · 분기 칸 · 도장 수명 10초 · 판 90초</p>
</div>

<div class="rotate" id="rotate">폰을 가로로 돌려 주세요</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
// v12 덜어내기 스위치. 다시 붙일 때 true로 바꾸고 rules.md·decisions.md를 같이 고친다.
// speed: 진행/반대 방향키로 빠르게·느리게  fake: 걸린 척(C)  colors: 라벨 색·출고구 색(일반 상자가 자기 색 레일로)
// special: 빠른·느린 벨트, 정체·재분류 칸 맵  diff: 난이도 선택  editor: 맵 만들기  records: 기록 화면  pin: 우클릭 핀
const FEAT={speed:false,fake:false,colors:false,special:false,diff:false,editor:false,records:false,pin:false,
  switch:true}; // switch: v12-switch 시험 갈래. 일반 상자는 노란 분기 칸에서만 옆 레일로, 도장마다 수명, 판 90초
const STAMP_LIFE=10,SWITCH_TIME=90;
const LEDS=FEAT.switch; // 신호를 신호등 대신 벨트 양옆 띠 조명으로(모두에게 같은 화면), 신호음도 // 도장 수명(초), 분기 갈래 판 시간(초)
const HIDE_EXTRA=7;
const SEEK_DENSITY=.28; // 찾는 쪽 판 상자 밀도(칸 수에 곱함). 숨는 쪽은 .42(미끼 적당). 찾는 쪽은 눈으로 쫓을 수 있게 적게(약 15개)
 // 숨는 쪽 제한 시간 덤(초). v12 플레이: 30초는 약간 부족, 너무 주면 널널
const $=id=>document.getElementById(id);
const cv=$('c'),stage=$('stage');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));
const S=new THREE.Scene();S.background=new THREE.Color('#d6d0c2');
const cam=new THREE.PerspectiveCamera(36,16/9,.5,400);
S.add(new THREE.HemisphereLight('#ffffff','#8c8574',.95));const sun=new THREE.DirectionalLight('#fff4e0',.55);sun.position.set(-10,30,12);S.add(sun);
function resize(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;R.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();fitCam();}
addEventListener('resize',resize);
const M=c=>new THREE.MeshLambertMaterial({color:c}),B=c=>new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide});
const COL=['#2f6fd6','#ef7d22','#2f9d55','#8a4bc9','#d6322a'],CS=3.4,DV=[[1,0],[0,1],[-1,0],[0,-1]];
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,120),M('#cfc8b8'));floor.rotation.x=-Math.PI/2;S.add(floor);

// ---------- 맵 목록 ----------
let custom=null;try{custom=localStorage.getItem('box-custom');}catch(e){}
const mapList=()=>FEAT.special?[...Object.entries(MAPS).map(([k,v])=>({k,name:v.name,str:v.str})),...(custom&&FEAT.editor?[{k:'custom',name:'내 맵',str:custom}]:[])]:FEAT.switch?['switch','loop'].map(k=>({k,name:MAPS[k].name,str:MAPS[k].str})):[{k:'plain',name:MAPS.plain.name,str:MAPS.plain.str}];
let curKey=FEAT.special?'basic':FEAT.switch?'switch':'plain',diffKey='normal';try{if(FEAT.diff)diffKey=localStorage.getItem('box-diff')||'normal';}catch(e){}
const wopt=()=>({diff:diffKey,colors:FEAT.colors});
const curEntry=()=>mapList().find(m=>m.k===curKey)||mapList()[0];

// ---------- 칸 그리기 ----------
let world=null,W=14,H=6,tileG=new THREE.Group(),dyn=[],edGrid=null,lamps=[];S.add(tileG);
const wx=x=>(x-(W-1)/2)*CS,wz=y=>(y-(H-1)/2)*CS;
const triGeo=(()=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([.55,0,0,-.35,0,-.42,-.35,0,.42],3));return g;})();
function arrow(d,color,ox=0,oz=0,s=1){const a=new THREE.Mesh(triGeo,B(color));a.rotation.y=-d*Math.PI/2;a.scale.setScalar(s);a.position.set(ox,.34,oz);return a;}
function exitColorAhead(tiles,x,y,d){for(let i=0;i<W*H;i++){x=(x+DV[d][0]+W)%W;y=(y+DV[d][1]+H)%H;const t=tiles[y][x];if(!t||t.t==='turn')return -1;if(t.t==='exit')return t.c;d=t.d;}return -1;}
let occ={x0:0,x1:13,y0:0,y1:5}; // 칸이 실제로 있는 범위(카메라 맞추기용)
function buildTiles(tiles){S.remove(tileG);tileG=new THREE.Group();S.add(tileG);dyn=[];H=tiles.length;W=tiles[0].length;const P=CS*.82;
  occ={x0:W,x1:-1,y0:H,y1:-1};tiles.forEach((r,y)=>r.forEach((t,x)=>{if(t){occ.x0=Math.min(occ.x0,x);occ.x1=Math.max(occ.x1,x);occ.y0=Math.min(occ.y0,y);occ.y1=Math.max(occ.y1,y);}}));if(occ.x1<0)occ={x0:0,x1:W-1,y0:0,y1:H-1};
  const plateGeo=new THREE.BoxGeometry(P,.3,P);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=tiles[y][x];if(!t)continue;const g=new THREE.Group();g.position.set(wx(x),0,wz(y));tileG.add(g);
    const base={belt:{n:'#3a3936',f:'#2f2c27',s:'#30353b'}[t.sp],sort:'#3a3936',turn:'#454340',jam:'#3a3936',relabel:COL[t.c],exit:'#3a3936',spawn:'#24231f'}[t.t];
    const p=new THREE.Mesh(plateGeo,M(t.sw?'#c99a1e':base));p.position.y=.15;g.add(p);
    if(t.sw)[-1,1].forEach(k=>{const a=arrow((t.d+(k>0?1:3))%4,'#1e1c18',DV[(t.d+1)%4][0]*k*.95,DV[(t.d+1)%4][1]*k*.95,.55);g.add(a);}); // 분기 칸: 노란 판 + 옆 화살표
    // 같은 색끼리: 이 레일이 곧장 닿는 출고구 색으로 양옆 띠
    if(LEDS&&(t.t==='belt'||t.t==='spawn'||t.t==='jam')){[-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.BoxGeometry(t.d%2?.32:CS*1.0,.14,t.d%2?CS*1.0:.32),ledMat);e.position.set(t.d%2?s*CS*.47:0,.33,t.d%2?0:s*CS*.47);g.add(e);});}
    if(t.tun){const roof=new THREE.Mesh(new THREE.BoxGeometry(CS*1.01,.35,CS*1.01),M('#4a4640'));roof.position.y=2.75;g.add(roof);
      [-1,1].forEach(s=>{const wall=new THREE.Mesh(new THREE.BoxGeometry(t.d%2?.25:CS*1.01,2.6,t.d%2?CS*1.01:.25),M('#5a554d'));wall.position.set(t.d%2?s*CS*.5:0,1.3,t.d%2?0:s*CS*.5);if(!tiles[y+(t.d%2?0:s)]||!(tiles[y+(t.d%2?0:s)][x+(t.d%2?s:0)]||{}).tun)g.add(wall);});
      const stripe=new THREE.Mesh(new THREE.BoxGeometry(CS*1.01,.04,.3),B('#f2c230'));stripe.position.set(0,2.95,0);g.add(stripe);} // 터널: 덮개와 바깥쪽 벽
    if(FEAT.colors&&(t.t==='belt'||t.t==='spawn'||t.t==='jam'||t.t==='sort')){const c=exitColorAhead(tiles,x,y,t.d);if(c>=0){[-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.BoxGeometry(t.d%2?.22:P,.36,t.d%2?P:.22),M(COL[c]));e.position.set(t.d%2?s*P/2:0,.18,t.d%2?0:s*P/2);g.add(e);});}}
    if(t.t==='belt'){if(t.sp==='f'){g.add(arrow(t.d,'#e0b84a',-.5*DV[t.d][0],-.5*DV[t.d][1],.9));g.add(arrow(t.d,'#e0b84a',.5*DV[t.d][0],.5*DV[t.d][1],.9));}else g.add(arrow(t.d,t.sp==='s'?'#7f9bb3':'#6f6c64',0,0,1.1));}
    if(t.t==='spawn')g.add(arrow(t.d,'#ffffff',0,0,1.2));
    if(t.t==='relabel'){g.add(arrow(t.d,'#1e1c18'));[-1,1].forEach(s=>{const pl=new THREE.Mesh(new THREE.BoxGeometry(.3,2.6,.3),M(COL[t.c]));pl.position.set(DV[t.d][1]*s*P/2,1.3,DV[t.d][0]*s*P/2);g.add(pl);});}
    if(t.t==='jam'){g.add(arrow(t.d,'#6f6c64'));const pil=new THREE.Mesh(new THREE.BoxGeometry(.4,1.6,.4),M('#5c574e'));pil.position.set(-DV[t.d][1]*P/2-DV[t.d][0]*.2,.8,-DV[t.d][0]*P/2);g.add(pil);
      const l=new THREE.Mesh(new THREE.BoxGeometry(.6,.45,.6),B('#d6322a'));l.position.set(pil.position.x,1.8,pil.position.z);g.add(l);dyn.push({k:'jam',x,y,l});}
    if(t.t==='sort'){const bar=new THREE.Mesh(new THREE.BoxGeometry(t.d%2?CS*1.01:.3,.46,t.d%2?.3:CS*1.01),M('#8a7a3a'));bar.position.y=.25;g.add(bar);
      g.add(arrow(t.d,'#6f6c64',-DV[t.d][0]*.8,-DV[t.d][1]*.8,.8));dyn.push({k:'sort',bar});}
    if(t.t==='turn'){const disc=new THREE.Mesh(new THREE.CylinderGeometry(P*.45,P*.45,.08,24),M('#6b6862'));disc.position.y=.34;g.add(disc);const a=arrow(t.d,'#f2c230',0,0,1.3);a.position.y=.42;g.add(a);dyn.push({k:'turn',x,y,t,a});}
    if(t.t==='exit'){const c=FEAT.colors?COL[t.c]:'#8f8775';[-1,1].forEach(s=>{const pl=new THREE.Mesh(new THREE.BoxGeometry(.45,3.2,.45),M(c));pl.position.set(DV[t.d][1]*s*P/2,1.6,DV[t.d][0]*s*P/2);g.add(pl);});
      const beam=new THREE.Mesh(new THREE.BoxGeometry(DV[t.d][1]?P+.5:.6,.6,DV[t.d][0]?P+.5:.6),M(c));beam.position.y=3.2;g.add(beam);g.add(arrow(t.d,c,0,0,1.1));}
}
  lamps=[];{const g=new THREE.Group();g.position.set(wx(0)-CS*1.15,0,wz((H-1)/2));g.visible=!LEDS;tileG.add(g);
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,4,10),M('#2a2824'));pole.position.y=2;g.add(pole);
    const box=new THREE.Mesh(new THREE.BoxGeometry(1.7,4.2,1.2),M('#1e1c18'));box.position.y=5.6;g.add(box);
    const red=new THREE.Mesh(new THREE.SphereGeometry(.55,20,14),B('#3d1513'));red.position.set(0,6.9,.45);g.add(red);
    const yel=new THREE.Mesh(new THREE.SphereGeometry(.55,20,14),B('#3a3010'));yel.position.set(0,5.6,.45);g.add(yel);

  const ext=dd=>{cam.position.set(cx+camDir.x*dd,camDir.y*dd,cz+camDir.z*dd);cam.lookAt(cx,0,cz);cam.updateMatrixWorld();let a=1,b=-1,c=1,e=-1;

let swipe=null;const SWIPE=22;
// 화면 방향(오른쪽 +x, 아래 +y) → 세계 방향(0~3). 카메라가 돌아가도(세로 화면) 내가 민 쪽으로 간다
const sdA=new THREE.Vector3(),sdB=new THREE.Vector3();
function screenToWorld(sx,sy,only){const legacy=only?(only[0]%2===1?(sy>0?1:3):(sx>0?0:2)):Math.abs(sy)>=Math.abs(sx)?(sy>0?1:3):(sx>0?0:2);if(!world)return legacy;const [x,y]=player&&!player.pending?world.pos(player):[W/2,H/2];
  sdA.set(wx(x),.5,wz(y)).project(cam);let best=-1,bd=-2;const sl=Math.hypot(sx,sy)||1;
  for(const h of only||[0,1,2,3]){sdB.set(wx(x+DV[h][0]),.5,wz(y+DV[h][1])).project(cam);const vx=(sdB.x-sdA.x)*(cam.aspect||1),vy=-(sdB.y-sdA.y),L=Math.hypot(vx,vy);const dot=(vx*sx+vy*sy)/(L*sl);if(isFinite(dot)&&dot>bd){bd=dot;best=h;}}
  return best<0?legacy:best;}
function swipeDir(dx,dy){return screenToWorld(dx,dy);}
function swipeCheck(e){if(!swipe||swipe.done||e.pointerId!==swipe.id)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(Math.hypot(dx,dy)<SWIPE)return;swipe.done=true;hideInput(swipeDir(dx,dy));$('tHint').hidden=true;}

  const d=player.d;hideInput(screenToWorld(e.clientX-px,e.clientY-py,[(d+1)%4,(d+3)%4]));$('tHint').hidden=true;} // 내 상자에서 누른 쪽으로(레일과 수직이 아닌 쪽이면 hideInput이 무시)

// ---------- 사람 기록 ----------
// 숨는 쪽 판에서 내 입력을 신호 기준으로 남긴다. 초록 한 번 = 창(window) 하나:
// {need: 판 시작 때 도장까지 남은 줄 수(0,1,2=2 이상), g: 그 초록의 길이(초), hops: [{ph: 'g'|'y'|'r' 옮긴 순간의 신호, t: 그 신호가 켜진 뒤 초, dir: 1 도장 쪽, -1 반대쪽, 0 도장 레일 위에서}]}
// 아무것도 안 한 초록도 창으로 남긴다(사람이 기다린 것도 패턴이다). 판이 끝나면 저장: 아티팩트에선 공유 db(plays), 아니면 이 브라우저.
const HUMAN_VER=FEAT.switch?4:1,HUMAN_MIN=12,HUMAN_KEY=FEAT.switch?'box-human4':'box-human'; // 사람 창이 이만큼 모이면 숨은 AI가 사람 기록을 쓴다
let rec=null,humanPlays=[],humanSrc='none',DB=null;
const needOf=b=>{if(!b||!b.stamp)return 0;const t=world.T(b.cx,b.cy),vert=t&&t.d%2===1;return Math.min(2,vert?Math.abs(b.stamp[0]-b.cx):Math.abs(b.stamp[1]-b.cy));};
function recLight(s){if(!rec||!player)return;const now=world.t;
  if(rec.cur&&rec.cur.ph==='g'&&s!=='green')rec.cur.g=+(now-rec.cur.t0).toFixed(2);
  if(s==='green'){recClose();rec.cur={need:needOf(player),g:0,hops:[],t0:now,ph:'g'};}else if(rec.cur)rec.cur.ph=s;rec.ps=now;}
function recHop(dir,sw,tun){if(!rec||!rec.cur)return;const h={ph:world.light==='green'?'g':world.light==='yellow'?'y':'r',t:+(world.t-rec.ps).toFixed(2),dir};if(FEAT.switch){h.sw=sw?1:0;if(tun)h.tun=1;}rec.cur.hops.push(h);}
function recClose(){if(rec&&rec.cur){const c=rec.cur;if(!c.g)c.g=+(world.t-c.t0).toFixed(2);rec.wins.push({need:c.need,g:c.g,hops:c.hops});rec.cur=null;}}
function recSave(win){if(!rec)return;recClose();const play={v:HUMAN_VER,at:Date.now(),map:curKey,win:!!win,got:player?player.got||0:0,wins:rec.wins.slice(0,60)};rec=null;if(!play.wins.length)return;
  humanPlays.unshift(play);humanPlays=humanPlays.slice(0,80);
  try{const L=JSON.parse(localStorage.getItem(HUMAN_KEY)||'[]');L.unshift(play);localStorage.setItem(HUMAN_KEY,JSON.stringify(L.slice(0,40)));}catch(e){}
  if(DB){DB.collection('plays').add(play).catch(()=>{});}}
const humanWins=()=>humanPlays.flatMap(p=>Array.isArray(p.wins)?p.wins:[]).filter(w=>w&&Array.isArray(w.hops));
try{const L=JSON.parse(localStorage.getItem(HUMAN_KEY)||'[]');if(Array.isArray(L)&&L.length){humanPlays=L;humanSrc='local';}}catch(e){}
// 아티팩트로 열었을 때: 공유 db에서 최근 기록을 읽는다(10초 안에 답 없으면 이 브라우저 기록만)
(async()=>{try{const c=window.claude;if(!c||!c.use)return;const db=await c.use('db');if(!db)return;DB=db;
  const q=await Promise.race([db.collection('plays').orderBy('at','desc').limit(80).get(),new Promise((_,r)=>setTimeout(()=>r(0),10000))]);
  const ps=q.docs.map(d=>d.data()).filter(p=>p&&p.v===HUMAN_VER&&Array.isArray(p.wins));if(ps.length){humanPlays=ps;humanSrc='db';}if(mode===null&&$('humanNote'))$('humanNote').textContent=humanNote();}catch(e){}})();
function humanNote(){const n=humanWins().length;return n>=HUMAN_MIN?`찾는 쪽의 숨은 셋은 지금 사람 기록 ${humanPlays.length}판(초록 ${n}번)을 따라 움직여요.`:`찾는 쪽의 숨은 셋은 아직 기본 패턴으로 움직여요. 숨는 쪽을 하면 내 움직임이 기록되고, 초록 ${HUMAN_MIN}번 넘게 모이면 숨은 셋이 그걸 따라 해요(지금 ${n}번).`;}

// ---------- 숨은 AI(찾는 쪽 판) ----------
// 초록마다 창 하나를 골라 그대로 다시 한다. 사람 기록이 충분하면 거기서(도장까지 남은 줄 수가 같은 창), 아니면 성격별 기본 패턴에서.
// 기본 패턴은 소셜 스텔스 게임에서 사람이 들키는 습관을 옮긴 것: 초록 직후 몰아치기, 일찍 얼기, 되돌리기, 일반 상자처럼 아무 때나 한 번,
// 초록이 한참 지난 뒤 '아직 괜찮겠지' 하고 옮기기(노랑에 걸리기 쉬움), 시간 없으면 빨강에 지르기.
const PERS={rush:{react:.5},careful:{react:.3},mimic:{react:.2}};
const rnd=(a,b)=>a+Math.random()*(b-a),chance=p=>Math.random()<p;
function synthWin(pers,need,panic){const hops=[];
  if(pers==='rush'){if(need>0){let t=chance(.5)?rnd(.15,.4):rnd(.8,2.6);hops.push({ph:'g',t,dir:1});if(chance(.25)){t+=rnd(.4,.6);hops.push({ph:'g',t,dir:-1});t+=rnd(.4,.6);hops.push({ph:'g',t,dir:1});}if(need>1){t+=rnd(.42,.65);hops.push({ph:'g',t,dir:1});}}
    else if(chance(.3))hops.push({ph:'g',t:rnd(.2,.6),dir:0});if(need>0&&chance(.12+panic*.2))hops.push({ph:'r',t:rnd(.3,1.6),dir:1});}
  else if(pers==='careful'){if(need>0&&!chance(.2))hops.push({ph:'g',t:rnd(1,2.6),dir:1});if(need>0&&chance(panic*.15))hops.push({ph:'r',t:rnd(.8,2),dir:1});}
  else{if(need>0&&!chance(.3))hops.push({ph:'g',t:rnd(.3,2.6),dir:1});else if(chance(.35))hops.push({ph:'g',t:rnd(.3,2.6),dir:0});}
  return {need,hops};}
// 분기 갈래 기본 패턴: 성격별로 분기 칸까지 기다릴 확률(나머지는 아무 데서나 지름)
const SW_WAIT={rush:.5,careful:1,mimic:.9};
function swWin(pers,w){return {need:w.need,hops:w.hops.map(h=>Object.assign({},h,{sw:h.sw!=null?h.sw:(chance(SW_WAIT[pers])?1:0)}))};}
function pickWin(b){const need=needOf(b),pool=humanWins();
  if(pool.length>=HUMAN_MIN){const same=pool.filter(w=>Math.min(2,w.need|0)===need);const src=same.length?same:pool;b.src='human';return src[(Math.random()*src.length)|0];}
  b.src='synth';const sw0=synthWin(b.pers,need,1-Math.max(0,time)/Math.max(1,b.T0||150));return FEAT.switch?swWin(b.pers,sw0):sw0;}
// 사람이 노랑을 늦게 알아챈 시간: 기록에 노랑 중 움직임이 있으면 거기서, 없으면 성격값
function reactOf(b){const ys=humanWins().flatMap(w=>w.hops).filter(h=>h.ph==='y');return ys.length&&b.src==='human'?ys[(Math.random()*ys.length)|0].t:PERS[b.pers].react*DIFF[diffKey].k;}
function botPlan(b){const w=pickWin(b);b.plan=(w.hops||[]).slice().sort((x,y)=>'gyr'.indexOf(x.ph)-'gyr'.indexOf(y.ph)||x.t-y.t);b.pi=0;b.react=reactOf(b);}
function botHop(b,dir){const sd=stampDir(world,b,b.stamp);let h=-1;
  if(dir===1)h=sd;else if(dir===-1)h=sd>=0?(sd+2)%4:world.randSide(b);else h=world.randSide(b);
  if(h>=0)world.hop(b,h);b.pi++;}
function botThink(b,dt){if(b.found||b.gone||b.pending)return;if(!b.plan)botPlan(b);if(world.midMove(b))return;
  if(world.isTunnel&&world.isTunnel(b.cx,b.cy)){const h=stampDir(world,b,b.stamp);if(h>=0&&world.isTunnel(b.cx+DX[h],b.cy+DY[h])&&Math.random()<dt*3){world.hop(b,h);return;}} // 터널 안이면 안 보이니 도장 쪽으로 갈아탐
  const hp=b.plan[b.pi];if(!hp)return;const L=world.light,lt=world.lightT;
  // 분기 칸에서 넘어간 움직임이면 분기 칸에 올 때까지 기다린다. 도장 수명이 3초 안 남았으면 그냥 지른다
  const waitSw=FEAT.switch&&hp.sw===1&&hp.ph==='g'&&!world.isSwitch(b.cx,b.cy)&&!(b.stampT<3);
  if(hp.ph==='g'){if(L==='green'){if(lt>=hp.t&&!waitSw)botHop(b,hp.dir);}
    else if(L==='yellow'&&lt<b.react)botHop(b,hp.dir); // 노랑을 아직 못 봤다
    else b.pi++;}
  else if(hp.ph==='y'){if(L==='yellow'&&lt>=hp.t)botHop(b,hp.dir);else if(L==='red')b.pi++;}
  else if(L==='red'&&lt>=hp.t)botHop(b,hp.dir);}

// AI 직원
function huntStep(dt){const p=player,D=DIFF[diffKey];worker.position.z=wz(H-1)+CS*.9;
  if(hunt.stun>0){hunt.stun-=dt;return;}const [ppx]=world.pos(p);
  if(!hunt.target){worker.position.x+=(THREE.MathUtils.clamp(wx(ppx)*.4,wx(0),wx(W-1))-worker.position.x)*dt*.6;

    hunt.t-=dt;if(world.light==='red'&&hunt.t<=0&&hunt.scans>0){hunt.t=.35;const cand=world.boxes.filter(b=>!b.gone&&!b.pending&&!inTun(b));const top=cand.reduce((a,b)=>b.sus>a.sus?b:a,cand[0]);
      if(top&&top.sus>1.1&&Math.random()<Math.min(.95,(top.sus-.6)/2.4)){hunt.target=top;hunt.aim=D.aim;}}}
  else{const t=hunt.target;if(inTun(t)){ring.visible=laser.visible=false;hunt.target=null;return;} // 덮개 아래로 들어가면 조준 풀림
    const [tx,ty]=world.pos(t);worker.position.x+=(THREE.MathUtils.clamp(wx(tx),wx(0),wx(W-1))-worker.position.x)*dt*1.5;hunt.aim-=dt;ring.visible=laser.visible=true;ring.position.set(wx(tx),.38,wz(ty));
    laser.geometry.setFromPoints([new THREE.Vector3(worker.position.x,2.4,worker.position.z),new THREE.Vector3(wx(tx),t.size*.8+.33,wz(ty))]);
    if(hunt.aim<=0||t.pending){ring.visible=laser.visible=false;hunt.target=null;if(t.pending)return;hunt.scans--;
      if(t===p&&p.fakeT>0){say('삐— 바코드 인식 실패');hunt.stun=2.5;return;}
      if(t===p){end(false,`도장 ${p.got}/${goal}에서 스캐너에 찍힘.`,p.got*100);return;}
      say('직원: 아… 그냥 상자네');hunt.stun=3;t.sus=0;}}}

// ---------- 편집기 ----------
const PAL=[['erase','지우개'],['n','벨트'],['f','빠른 벨트'],['s','느린 벨트'],['J','정체'],['C','재분류'],['X','출고'],['I','입고'],['W','분기'],['U','터널']];
let ed={tool:'n',d:0,side:1,cols:[0],tiles:null,painting:false};
function openEditor(){mode='edit';over=true;hideMarks();clearStamps();$('panel').hidden=true;['hideTools','seekTools','pauseBtn','timeWrap','susWrap'].forEach(id=>$(id).hidden=true);$('editTools').hidden=false;
  const m=parseMap(curEntry().str);const T=[];for(let y=0;y<8;y++){T.push([]);for(let x=0;x<14;x++)T[y].push((m.tiles[y]||[])[x]||null);}ed.tiles=T;
  world=null;clearMeshes();buildTiles(ed.tiles);if(edGrid)S.remove(edGrid);S.add(edGrid=makeEdGrid());$('modeL').innerHTML='<b>맵 만들기</b> · 칸을 클릭·드래그해서 칠하기';$('goalL').textContent='';
  $('palette').innerHTML=PAL.map(([k,n])=>`<button class="alt" data-tool="${k}">${n}</button>`).join('');$('palette').querySelectorAll('button').forEach(b=>b.onclick=()=>{ed.tool=b.dataset.tool;paintUi();});
  $('colorPick').innerHTML=COL.map((c,i)=>`<button class="alt cbtn" data-col="${i}" aria-label="색 ${i+1}" style="background:${c}"></button>`).join('');
  $('colorPick').querySelectorAll('button').forEach(b=>b.onclick=()=>{ed.cols=[+b.dataset.col];paintUi();});paintUi();}
function rot(){ed.d=(ed.d+1)%4;paintUi();}function flipSide(){ed.side=ed.side===1?3:1;paintUi();}
$('rotBtn').onclick=rot;$('sideBtn').onclick=flipSide;
function paintUi(){$('palette').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tool===ed.tool));$('rotBtn').textContent=`방향 ${'→↓←↑'[ed.d]} (R)`;
  $('sideBtn').textContent=`옆: ${ed.side===1?'오른쪽':'왼쪽'} (F)`;$('colorPick').querySelectorAll('button').forEach(b=>b.style.outline=ed.cols.includes(+b.dataset.col)?'4px solid #1e1c18':'none');}
function makeTile(){const d=ed.d,s=(d+ed.side)%4,c=ed.cols[0];switch(ed.tool){case 'erase':return null;case 'n':case 'f':case 's':return {t:'belt',sp:ed.tool,d};
  case 'S':return {t:'sort',d};case 'T':return {t:'turn',d,s,per:3};case 'J':return {t:'jam',d};case 'C':return {t:'relabel',d,c};case 'X':return {t:'exit',d,c};case 'I':return {t:'spawn',d};case 'W':return {t:'belt',sp:'n',d,sw:true};case 'U':return {t:'belt',sp:'n',d,tun:true};}}
const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hp=new THREE.Vector3();
function cellAt(e){setRay(e);if(!ray.ray.intersectPlane(plane,hp))return null;const x=Math.round(hp.x/CS+(W-1)/2),y=Math.round(hp.z/CS+(H-1)/2);return (x>=0&&y>=0&&x<W&&y<H)?[x,y]:null;}
function paint(e){const c=cellAt(e);if(!c)return;const [x,y]=c;const nt=makeTile();if(tileToken(ed.tiles[y][x])===tileToken(nt))return;ed.tiles[y][x]=nt;buildTiles(ed.tiles);}
cv.addEventListener('pointerdown',e=>{if(mode!=='edit'||e.button!==0)return;ed.painting=true;cv.setPointerCapture(e.pointerId);paint(e);});
cv.addEventListener('pointermove',e=>{if(mode==='edit'&&ed.painting)paint(e);});
cv.addEventListener('pointerup',()=>ed.painting=false);
$('editDone').onclick=()=>{const str=mapToStr({tiles:ed.tiles});const f=ed.tiles.flat();const ok=f.some(t=>t&&t.t==='spawn')&&f.some(t=>t&&t.t==='exit');
  if(edGrid){S.remove(edGrid);edGrid=null;}$('editTools').hidden=true;$('panel').hidden=false;
  $('panelBox').innerHTML=`<h1>내 맵</h1>${ok?'':'<p style="color:#d6322a">입고(흰 화살표 칸)와 출고(색 아치)가 하나 이상 있어야 상자가 돌 수 있어요.</p>'}
  <p>아래 문자열이 이 맵이에요. 친구에게 주면 붙여넣고 불러오기만 하면 돼요.</p><label for="shareTxt">공유 문자열</label><textarea id="shareTxt">${str}</textarea>
  <div class="row"><button id="saveMap"${ok?'':' disabled'}>내 맵으로 저장</button><button class="alt" id="copyMap">복사</button><button class="alt" id="loadMap">붙여넣은 걸로 불러오기</button><button class="alt" id="backEd">계속 편집</button><button class="alt" id="edMenu">메뉴로</button></div>`;
  $('saveMap').onclick=()=>{custom=$('shareTxt').value.trim();try{localStorage.setItem('box-custom',custom);}catch(e){}curKey='custom';menu();say('내 맵으로 저장했어요');};
  $('copyMap').onclick=()=>{const t=$('shareTxt');if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>say('복사했어요'),()=>t.select());else t.select();};
  $('loadMap').onclick=()=>{const v=$('shareTxt').value.trim();try{const m=parseMap(v);if(!m.tiles.flat().some(Boolean))throw 0;custom=v;try{localStorage.setItem('box-custom',custom);}catch(e){}curKey='custom';openEditor();}catch(err){say('문자열을 읽지 못했어요');}};
  $('backEd').onclick=()=>openEditor();$('edMenu').onclick=()=>menu();};

// ---------- 루프 ----------
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(world&&mode!=='edit'&&!paused){const live=(mode==='hide'||mode==='seek')&&!over;
    if(live){time-=dt;
      if(FEAT.speed&&mode==='hide'&&player&&!player.pending){let k=0;Object.keys(KD).forEach(code=>{if(keys[code]){const h=KD[code];if(h===player.d)k=1;else if(h===(player.d+2)%4)k=-1;}});
        player.mul=k>0?1.45:k<0?.6:1;if(k&&world.light==='red')sus(player,dt*3);}
      if(mode==='seek')bots.forEach(b=>{if(!b.T0)b.T0=time;botThink(b,dt);});}
    // 터널에 들어간 줄과 나온 줄이 다르면 직원이 놓친다: 의심 0
    if(live&&mode==='hide'&&world.isTunnel)world.boxes.forEach(b=>{if(b.gone||b.pending)return;const it=inTun(b);if(it&&!b.wasTun)b.tunY=b.cy;if(!it&&b.wasTun&&b.tunY!=null&&b.cy!==b.tunY){b.sus=0;if(b===player)say('직원이 놓쳤다',1.2);}b.wasTun=it;});
    if(live&&mode==='hide'&&hopQ&&player&&!world.midMove(player)){const q=hopQ;hopQ=null;if(performance.now()-q.t<300)playerHop(q.h);}
    if(live&&mode==='hide'){sig(world,dt);
      const s=player.stamp;if(s&&world.light==='green'&&world.lightT>.6&&world.boxes.some(b=>!b.gone&&!b.pending&&Math.abs(b.cx-s[0])<=1&&Math.abs(b.cy-s[1])<=1)&&Math.random()<dt*.9)world.setLight('yellow');}
    else if(live&&mode==='seek')seekSignal(dt);else if(!live)idleSig(world,dt);
    // 분기 갈래: 도장 수명. 다 되면 다른 곳으로 옮겨 간다(존버 방지)
    if(live&&FEAT.switch)(mode==='hide'?[player]:bots).forEach(b=>{if(!b||b.gone||b.found||!b.stamp||over)return;b.stampT-=dt;if(b.stampT<=0){placeStamp(b);if(b===player)say('도장이 다른 데로 옮겨 갔다',1.2);}});
    if(live)(mode==='hide'?[player]:bots).forEach(b=>{if(!b||b.gone||b.found||!b.stamp||b.pending||over)return;if(onStamp(world,b,b.stamp)){b.got++;
      if(b===player){say(`도장 ${b.got}/${goal}`);if(b.got>=goal){end(true,`${Math.round((performance.now()-t0)/1000)}초 만에 도장 ${goal}개, 직원 스캔 ${hunt.scans}번 남음.`,1000+Math.max(0,time)*10);return;}}
      else if(b.got>=goal){b.gone=true;b.smesh.visible=false;escaped++;say('누군가 도장을 다 찍고 빠져나갔다…');checkSeekEnd();return;}
      placeStamp(b);}});
    world.step(dt);
    world.events.forEach(ev=>{
      if(ev.type==='thud'){const m=meshes.get(ev.b);if(m)m.bump=.3;if(ev.off)alertOn(ev.b);if(live&&mode==='hide'&&ev.off)sus(ev.b,3.6);if(live&&mode==='hide'&&FEAT.switch&&world.hasSwitches&&!ev.off&&!ev.sw&&!ev.tun)sus(ev.b,1.6);}
      if(ev.type==='deliver'&&FEAT.switch&&ev.b.kind==='npc')ev.b.pat=newPat(); // 출고된 일반 상자는 새 상자로 다시 나온다
      if(ev.type==='frozen'){alertOn(ev.b);if(live&&mode==='hide'){sus(ev.b,3.2);if(ev.b===player)say('넘어가다 걸렸다!',1.2);}}
      if(ev.type==='light'){if(live)lightSound(ev.s);if(ev.s==='green')alertsOff();if(live&&mode==='hide')recLight(ev.s);if(live&&mode==='seek'&&ev.s==='green')bots.forEach(b=>{if(!b.found&&!b.gone)botPlan(b);});}});



    {const on=live&&world.light==='red';stage.classList.toggle('red',on);$('redTag').hidden=!on;if(on)$('redTag').textContent=mode==='seek'?`보는 중 ${Math.max(0,2.5-world.lightT).toFixed(1)}초 · 지금 옆으로 가는 상자는 !`:'직원이 보는 중';}
    if(LEDS){const L=world.light;ledMat.color.set(L==='red'?'#ff2a1f':L==='yellow'?(Math.floor(now/90)%2?'#ffd000':'#6b5a00'):'#2fd16a');}
    lamps.forEach(l=>{l.red.material.color.set(world.light==='red'?'#ff3b30':'#3d1513');l.yel.material.color.set(world.light==='yellow'?'#ffcc00':'#3a3010');l.green.material.color.set(world.light==='green'?'#35e06f':'#0f2d1a');});

    const blink=false;
    dyn.forEach(o=>{if(o.k==='sort')o.bar.material.color.set(world.sortOn?'#ffd21f':blink?'#f7e27a':'#8a7a3a');
      else if(o.k==='turn')o.a.rotation.y=-world.turnDir(o.t,o.x,o.y)*Math.PI/2;
      else if(o.k==='jam')o.l.material.color.set(world.jamOpen(o.x,o.y)?'#2f9d55':'#d6322a');});
    world.events=[];

    world.boxes.forEach(b=>{const m=meshFor(b);if(b.gone||b.pending||inTun(b)){m.g.visible=false;return;}m.g.visible=true;if(FEAT.colors&&m.dest!==b.dest){m.dest=b.dest;m.lab.material=labelMats[b.dest];}
      const [x,y]=world.pos(b);let h=0;if(m.bump>0){m.bump-=dt;h=Math.abs(Math.sin(m.bump*30))*.15;}m.g.position.set(wx(x),h,wz(y));});
    stampMeshes.forEach((g,i)=>{const c=g.userData.coin;c.rotation.z+=dt*2.5;c.position.y=2.6+.25*Math.sin(now/300+i);});
    if(FEAT.switch)(mode==='hide'?[player]:bots).forEach(b=>{if(!b||!b.smesh||b.stampT==null)return;const f=Math.max(0,b.stampT/STAMP_LIFE),r=b.smesh.children[0];r.scale.setScalar(.35+.65*f);b.smesh.userData.coin.visible=!(b.stampT<3&&Math.floor(now/120)%2);}); // 고리가 줄어들고, 3초 남으면 동전이 깜빡
    const hv=!!(hover&&mode==='seek'&&!over&&!hover.gone&&!hover.found);hoverRing.visible=hv;if(hv){const [hx,hy]=world.pos(hover);hoverRing.position.set(wx(hx),.42,wz(hy));}
    if(mode==='hide'&&player&&!player.pending){const [x,y]=world.pos(player);const X=wx(x),Z=wz(y),h=player.size*.8+.33;
      meArrow.position.set(X,h+1.4+.35*Math.sin(now/220),Z);meArrow.quaternion.copy(cam.quaternion);
      if(live)huntStep(dt);}
    if(live&&time<=0){if(mode==='hide')end(false,`시간 끝. 도장 ${player.got}/${goal}.`,player.got*100);else end(false,`시간 끝. 찾음 ${found}, 놓침 ${escaped}.`,found*1000);}
    if(live)updHud();}
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').hidden=true;}
  R.render(S,cam);requestAnimationFrame(frame);}
// 테스트용 들여다보기(화면 흐름 테스트가 씀)
window.__box={s2w:(x,y)=>screenToWorld(x,y),human:{get plays(){return humanPlays.length;},get windows(){return humanWins().length;},get src(){return humanSrc;}},get bots(){return bots;},get mode(){return mode;},get player(){return player;},get world(){return world;},get over(){return over;},FEAT};
resize();menu();requestAnimationFrame(frame);
})();
